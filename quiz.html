s"], "correct": 3, "explanation": "Chemical reactions that take place in living organisms"}, {"id": "term_13", "type": "mcq", "question": "What is the definition of <b>Light microscope</b>?", "options": ["The ability to detect changes in the internal or external environment and respond to them", "Of enzymes, only able to act on a particular (specific) substrate", "An enzyme that breaks down the milk sugar lactose into smaller sugar molecules that can be absorbed into the blood", "A microscope that shines light through the specimen and uses glass lenses to magnify and focus the image; a very good one magnifies about \u00d71500"], "correct": 3, "explanation": "A microscope that shines light through the specimen and uses glass lenses to magnify and focus the image; a very good one magnifies about \u00d71500"}, {"id": "term_14", "type": "mcq", "question": "What is the definition of <b>Electron microscope</b>?", "options": ["A substance made of only one kind of atom, e.g. carbon (C), hydrogen (H), oxygen (O) or nitrogen (N)", "A microscope that can magnify far more than a light microscope; needed to see ribosomes, and to see mitochondria clearly", "The food test for reducing sugars: heat the food with Benedict&#x27;s solution in a water-bath; green, yellow or orange-red means reducing sugar is present", "An enzyme that catalyses the breakdown of starch to maltose"], "correct": 1, "explanation": "A microscope that can magnify far more than a light microscope; needed to see ribosomes, and to see mitochondria clearly"}, {"id": "term_15", "type": "mcq", "question": "What is the definition of <b>Photomicrograph</b>?", "options": ["A photograph taken using a light microscope", "The ability to detect changes in the internal or external environment and respond to them", "The protein that forms hair (and fingernails)", "Proteins that act as biological catalysts, speeding up chemical reactions in living organisms; all enzymes are proteins"], "correct": 0, "explanation": "A photograph taken using a light microscope"}, {"id": "term_16", "type": "mcq", "question": "What is the definition of <b>Electron micrograph</b>?", "options": ["The single large circle of DNA found in a bacterial cell instead of chromosomes in a nucleus; sometimes called a bacterial chromosome", "A leaf that has some white areas (no chlorophyll) and some green areas (with chlorophyll)", "A carbohydrate that is used as an energy store in animal cells; made of many glucose molecules in branched chains", "A picture taken using an electron microscope, such as Figure B1.10"], "correct": 3, "explanation": "A picture taken using an electron microscope, such as Figure B1.10"}, {"id": "term_17", "type": "mcq", "question": "What is the definition of <b>Cell membrane</b>?", "options": ["A photograph taken using a light microscope", "A molecule that contains genetic information, in the form of genes, that controls the proteins that are made in the cell", "The diffusion of water molecules through a partially permeable membrane", "A very thin layer of protein and fat surrounding the cytoplasm of every cell; it controls what enters and leaves the cell"], "correct": 3, "explanation": "A very thin layer of protein and fat surrounding the cytoplasm of every cell; it controls what enters and leaves the cell"}, {"id": "term_18", "type": "mcq", "question": "What is the definition of <b>Partially permeable</b>?", "options": ["What happens when a plant cell loses so much water by osmosis that its cell membrane tears away from the cell wall; it can kill the cell", "The substance that bacterial cell walls are made of, instead of cellulose", "A pair of cells (containing chloroplasts) surrounding each stoma; they change shape to open and close it", "Allows some molecules and ions to pass through, but not others"], "correct": 3, "explanation": "Allows some molecules and ions to pass through, but not others"}, {"id": "term_19", "type": "mcq", "question": "What is the definition of <b>Cell wall</b>?", " ce dissolves; in the solutions in and around cells, the solvent is water", "An animal (insect, bat or bird) that carries pollen grains from one flower to another"], "correct": 1, "explanation": "The jelly-like material that fills a cell; it is nearly all water, with many substances (especially proteins) dissolved in it"}, {"id": "term_23", "type": "mcq", "question": "What is the definition of <b>Vacuole</b>?", "options": ["The part of an enzyme molecule to which the substrate temporarily binds", "A substance whose molecules are made of many amino acids linked together; each different protein has a different sequence of amino acids", "The outer layer of tissue on a plant; also the outer layer of an animal&#x27;s skin", "A fluid-filled space inside a cell, separated from the cytoplasm by a membrane"], "correct": 3, "explanation": "A fluid-filled space inside a cell, separated from the cytoplasm by a membrane"}, {"id": "term_24", "type": "mcq", "question": "What is the definition of <b>Cell sap</b>?", "options": ["A thin, transparent, waterproof covering made of a waxy substance, on the upper surface of a leaf", "The fluid that fills the large vacuoles in plant cells; a solution of sugars and other substances", "Collections of xylem tubes and phloem vessels running side by side, which form the veins in a leaf", "Tubes that carry sucrose (and amino acids) from one part of a plant to another"], "correct": 1, "explanation": "The fluid that fills the large vacuoles in plant cells; a solution of sugars and other substances"}, {"id": "term_25", "type": "mcq", "question": "What is the definition of <b>Vesicle</b>?", "options": ["Small, circular molecules of DNA found in many prokaryotic cells in addition to the main, much larger circle of DNA", "A very small vacuole", "The smallest unit from which all organisms are made", "A sugar that is used in respiration to release energy; formula C\u2086H\u2081\u2082O\u2086; the form in which carbohydrate is transported in the blood"], "  changing a variable"}, {"id": "term_168", "type": "mcq", "question": "What is the definition of <b>Potassium hydroxide solution</b>?", "options": ["An opening in the lower epidermis that lets carbon dioxide and oxygen diffuse in and out, and water vapour diffuse out", "A solution that absorbs carbon dioxide; used to remove carbon dioxide from the air around a leaf", "With a perfect mirror-image shape; the active site and its substrate have complementary shapes, so they fit together", "The surface area of an object divided by its volume; cutting a cube into smaller cubes increases this ratio, so substances diffuse in faster"], "correct": 1, "explanation": "A solution that absorbs carbon dioxide; used to remove carbon dioxide from the air around a leaf"}, {"id": "term_169", "type": "mcq", "question": "What is the definition of <b>Sodium hydrogencarbonate solution</b>?", "options": ["Mineral ions absorbed from the soil through the root hairs; they supply the nitrogen needed to make amino acids, proteins and chlorophyll", "Proteins that act as biological catalysts, speeding up chemical reactions in living organisms; all enzymes are proteins", "A solution that absorbs carbon dioxide; used to remove carbon dioxide from the air around a leaf", "A solution that provides carbon dioxide for aquatic plants; a higher concentration supplies more carbon dioxide"], "correct": 3, "explanation": "A solution that provides carbon dioxide for aquatic plants; a higher concentration supplies more carbon dioxide"}, {"id": "term_170", "type": "mcq", "question": "What is the definition of <b>Rate of photosynthesis</b>?", "options": ["A way of describing how much water a solution contains compared with dissolved solute; a dilute solution has a high water potential, a concentrated solution has a low water potential, and pure water has the highest water potential of all", "The part of an enzyme molecule to which the substrate temporarily binds", "How much photosynthesis happens in unit time, e.g. the number of oxygen bubbles released by an aquatic plant in one minute", "Carbohydrates that have relatively small molecules; they are soluble in water and they taste sweet"], "correct": 2, "explanation": "How much photosynthesis happens in unit time, e.g. the number of oxygen bubbles released by an aquatic plant in one minute"}, {"id": "term_171", "type": "mcq", "question": "What is the definition of <b>Limiting factor</b>?", "options": ["The factor in shortest supply (light intensity, carbon dioxide concentration or temperature) that stops the rate of photosynthesis going any higher", "Substances that include sugars, starch and cellulose; they contain carbon, hydrogen and oxygen, with about twice as many hydrogen atoms as carbon or oxygen atoms", "An enzyme that catalyses the breakdown of maltose to glucose", "Tubes that carry sucrose (and amino acids) from one part of a plant to another"], "correct": 0, "explanation": "The factor in shortest supply (light intensity, carbon dioxide concentration or temperature) that stops the rate of photosynthesis going any higher"}, {"id": "term_172", "type": "mcq", "question": "What is the definition of <b>Heat shield</b>?", "options": ["Made of just a single cell; bacteria and yeast are unicellular", "A transparent barrier between a lamp and a plant that lets light through but stops the lamp&#x27;s heat changing the temperature", "The movement of molecules or ions through a cell membrane from a region of lower concentration to a region of higher concentration (i.e. against a concentration gradient) using energy from respiration", "An enzyme that breaks down the milk sugar lactose into smaller sugar molecules that can be absorbed into the blood"], "correct": 1, "explanation": "A transparent barrier between a lamp and a plant that lets light through but stops the lamp&#x27;s heat changing the temperature"}, {"id": "term_173", "type": "mcq", "question": "What is the definition of <b>Glasshouse</b>?", "options": ["A glass building in which temperature, light and carbon dioxide can be controlled so that crops photosynthesise quickly and give a high yield", "A sweet liquid secreted by many insect-pollinated flowers, to attract their pollinators", "The ability to detect changes in the internal or external environment and respond to them", "Enzymes that break down lipids (fats and oils) into fatty acids and glycerol"], "correct": 0, "explanation": "A glass building in which temperature, light and carbon dioxide can be controlled so that crops photosynthesise quickly and give a high yield"}, {"id": "term_174", "type": "mcq", "question": "What is the definition of <b>Biofuels</b>?", "options": ["A sugar that is used in respiration to release energy; formula C\u2086H\u2081\u2082O\u2086; the form in which carbohydrate is transported in the blood", "A blue solution (also called biuret solution) that turns violet (purple) when mixed with proteins", "Fuels made from plants grown for the purpose, which can be burnt to produce electricity or move vehicles", "The outer layer of tissue on a plant; also the outer layer of an animal&#x27;s skin"], "correct": 2, "explanation": "Fuels made from plants grown for the purpose, which can be burnt to produce electricity or move vehicles"}], "freeform": [{"id": "qa_0", "type": "freeform", "question": "Name the part of a cell which has each of these functions:\n\na) makes proteins\n\nb) contains the information for which proteins to make\n\nc) photosynthesis\n\nd) prevents the cell bursting when it takes up water\n\ne) stores a solution of sugars and other solutes\n\nf) controls what enters and leaves the cell.", "answer": "a) Ribosome\n\nb) Nucleus (the DNA in its chromosomes carries the information)\n\nc) Chloroplast\n\nd) Cell wall\n\ne) Vacuole (the large permanent vacuole of a plant cell, which contains cell sap)\n\nf) Cell membrane", "marks": null}, {"id": "qa_1", "type": "freeform", "question": "Which of the structures that you have named in Question B1.05 are found in both animal and plant cells?", "answer": "The ribosome, the nucleus and the cell membrane are found in both animal and plant cells. The chloroplast and the cell wall are found only in plant cells. A large permanent vacuole containing cell sap is also a plant-cell feature; animal cells only have small vacuoles called vesicles.", "marks": null}, {"id": "qa_2", "type": "freeform", "question": "How many micrometres are there in 1 mm?", "answer": "There are 1000 \u00b5m in 1 mm. To convert millimetres to micrometres, multiply by 1000.", "marks": null}, {"id": "qa_3", "type": "freeform", "question": "Identify the characteristic which is not shown by all living organisms. (1 mark)\n\nA) excretion\nB) movement\nC) photosynthesis\nD) respiration", "answer": "C \u2014 photosynthesis. Only plants (and some other organisms such as algae) photosynthesise; animals, fungi and most bacteria do not. Excretion, movement and respiration are three of the seven characteristics shown by all living organisms.", "marks": 1}, {"id": "qa_4", "type": "freeform", "question": "The diagram below shows a cell from a plant leaf. Identify which labelled part contains DNA. (1 mark)\n\nA) the outer double line that forms the boundary of the cell\nB) the small oval structure at the left-hand side of the cell\nC) the narrow layer between the outer boundary and the large central space (top right)\nD) the large central space that fills most of the cell", "answer": "B \u2014 the small oval structure is the nucleus, which contains DNA in the form of chromosomes. (A is the cell wall, C is the cytoplasm and D is the large permanent vacuole.)", "marks": 1}, {"id": "qa_5", "type": "freeform", "question": "A diagram of a flower is 8 cm across. The magnification of the diagram is \u00d74. Identify the actual width of the flower. (1 mark)\n\nA) 3.2 mm\nB) 20 mm\nC) 0.5 cm\nD) 32 cm", "answer": "B \u2014 20 mm. Actual size = size of image \u00f7 magnification = 8 cm \u00f7 4 = 2 cm, and 2 cm \u00d7 10 = 20 mm. D (32 cm) comes from multiplying instead of dividing, and C (0.5 cm) comes from dividing 4 by 8.", "marks": 1}, {"id": "qa_6", "type": "freeform", "question": "These questions are about the diagram in Figure B2.04, which shows a dilute sugar solution (left) separated from a concentrated sugar solution (right) by a membrane with very small pores. What is the solvent in the sugar solution? What is the solute?", "answer": "The solvent is water. The solute is sugar.", "marks": null}, {"id": "qa_7", "type": "freeform", "question": "(Figure B2.04: a dilute sugar solution on the left and a concentrated sugar solution on the right, separated by a partially permeable membrane.) In which direction is the net movement of water molecules?", "answer": "From left to right, from the dilute sugar solution into the concentrated sugar solution. There are more water molecules on the left-hand side, so at any moment more of them hit a pore and pass through from left to right than pass from right to left.", "marks": null}, {"id": "qa_8", "type": "freeform", "question": "Copy and complete this sentence:\n\nWhen an animal cell is placed in pure water, water \u2026\u2026\u2026\u2026\u2026 the cell by \u2026\u2026\u2026\u2026\u2026 through the partially permeable cell \u2026\u2026\u2026\u2026\u2026.", "answer": "When an animal cell is placed in pure water, water enters (moves into) the cell by osmosis through the partially permeable cell membrane.", "marks": null}, {"id": "qa_9", "type": "freeform", "question": "Which element is found in all proteins, but not in carbohydrates and fats?", "answer": "Nitrogen (N). All proteins are made of amino acids, which contain carbon, hydrogen, oxygen and nitrogen, but carbohydrates and fats contain only carbon, hydrogen and oxygen. (Sulfur is found in some proteins, but not in all of them, so it is not the answer.)", "marks": null}, {"id": "qa_10", "type": "freeform", "question": "Identify which elements are contained in starch. (1 mark)\n\nA) carbon and hydrogen only\n\nB) carbon, hydrogen and oxygen\n\nC) carbon, hydrogen and nitrogen\n\nD) carbon, oxygen and nitrogen", "answer": "B \u2014 carbon, hydrogen and oxygen. [1] Starch is a carbohydrate made of many glucose molecules (C\u2086H\u2081\u2082O\u2086), and carbohydrates contain only C, H and O. A is wrong because it leaves out oxygen; C and D are wrong because starch contains no nitrogen (nitrogen is found in proteins).", "marks": 1}, {"id": "qa_11", "type": "freeform", "question": "You read about the enzyme lactase at the start of this chapter.\n\na) What type of enzyme is lactase?\n\nb) Name the substrate of lactase.", "answer": "a) Lactase is a carbohydrase, because it breaks down a carbohydrate (the sugar lactose) into smaller sugar molecules.\n\nb) Lactose, the sugar found in milk.", "marks": null}, {"id": "qa_12", "type": "freeform", "question": "Identify the smaller molecules from which an enzyme molecule is made. (1 mark)\n\nA) amino acids\nB) fatty acids\nC) glucose\nD) glycerol", "answer": "A \u2014 amino acids. Enzymes are proteins, and protein molecules are made from long chains of amino acids [1]. Fatty acids and glycerol are the smaller molecules that make up lipids, and glucose is the smaller molecule that makes up starch.", "marks": 1}, {"id": "qa_13", "type": "freeform", "question": "The figure below shows some stages in an enzyme-controlled reaction. (4 marks)\n\n(The figure shows three stages, from top to bottom. Stage 1: an enzyme molecule (labelled &#x27;enzyme&#x27;) with a dent in one side, labelled Q, and a separate round molecule labelled P. Stage 2: the round molecule fitted into the dent of the enzyme, with the two together labelled R. Stage 3: the enzyme, with its dent empty again, next to the round molecule now split into two pieces, labelled S.)\n\nIdentify the parts labelled", "answer": "P = substrate [1]\n\nQ = active site [1]\n\nR = enzyme\u2013substrate complex [1]\n\nS = products (the product molecules) [1]", "marks": 4}, {"id": "qa_14", "type": "freeform", "question": "Animals do not make or store starch. What is the substance that animals store, which is made of chains of glucose molecules?", "answer": "Glycogen (stored mainly in the liver and muscles).", "marks": null}, {"id": "qa_15", "type": "freeform", "question": "Figure B5.10 shows a photomicrograph (\u00d7400) of a small part of a leaf from a tea plant. Identify structures A\u2013D.\n\nDescription of Figure B5.10: label A points to the row of cells forming the top surface of the leaf; label B points to the layer of tall, narrow cells packed side by side just below it; label C points to the region of rounded, loosely arranged cells with spaces between them in the lower part of the leaf; label D points up to a gap in the bottom row of cells, with a large space just a", "answer": "A \u2014 upper epidermis (covered on the outside by the thin cuticle)\n\nB \u2014 palisade mesophyll\n\nC \u2014 spongy mesophyll\n\nD \u2014 a stoma (the opening between two guard cells in the lower epidermis)", "marks": null}, {"id": "qa_16", "type": "freeform", "question": "Identify the raw materials required for photosynthesis. (1 mark)\n\nA) carbon dioxide and oxygen\nB) oxygen and glucose\nC) glucose and water\nD) water and carbon dioxide", "answer": "D \u2014 water and carbon dioxide. These are the reactants of photosynthesis. Oxygen and glucose are the products, so options A, B and C are wrong.", "marks": 1}, {"id": "qa_17", "type": "freeform", "question": "Identify which ion a plant requires to make amino acids from glucose. (1 mark)\n\nA) calcium\nB) iron\nC) magnesium\nD) nitrate", "answer": "D \u2014 nitrate. Amino acids contain nitrogen, which glucose does not. Plants absorb nitrogen from the soil as nitrate ions and combine it with glucose to make amino acids. Magnesium ions are needed to make chlorophyll, not amino acids.", "marks": 1}], "truefalse": [{"id": "tf_0", "type": "truefalse", "statement": "Q: If you have a microscope, how can you distinguish between a cell from a plant, and a cell from an animal?", "correct": true, "explanation": "Q: If you have a microscope, how can you distinguish between a cell from a plant, and a cell from an animal?"}, {"id": "tf_1", "type": "truefalse", "statement": "Q: Can you think of any advantages for larger organisms of consisting of multiple cells, rather than just one larger cell?", "correct": true, "explanation": "Q: Can you think of any advantages for larger organisms of consisting of multiple cells, rather than just one larger cell?"}, {"id": "tf_2", "type": "truefalse", "statement": "Aim: To learn the seven characteristics of living things and what each one means, by playing a memory card game.", "correct": true, "explanation": "Aim: To learn the seven characteristics of living things and what each one means, by playing a memory card game."}, {"id": "tf_3", "type": "truefalse", "statement": "Group size: A group of four or five.", "correct": true, "explanation": "Group size: A group of four or five."}, {"id": "tf_4", "type": "truefalse", "statement": "You will need: 14 pieces of blank card, all exactly the same.", "correct": true, "explanation": "You will need: 14 pieces of blank card, all exactly the same."}, {"id": "tf_5", "type": "truefalse", "statement": "Expected results: Every name card is eventually paired with its correct description. Players who remember where cards are, and who know the descriptions well, collect the most pairs.", "correct": true, "explanation": "Expected results: Every name card is eventually paired with its correct description. Players who remember where cards are, and who know the descriptions well, collect the most pairs."}, {"id": "tf_6", "type": "truefalse", "statement": "Conclusion: By the end you should be able to name all seven characteristics and match each one to its meaning. The cards must be identical so that nobody can recognise a card from its back.", "correct": true, "explanation": "Conclusion: By the end you should be able to name all seven characteristics and match each one to its meaning. The cards must be identical so that nobody can recognise a card from its back."}, {"id": "tf_7", "type": "truefalse", "statement": "Safety: There are no special hazards in this activity.", "correct": true, "explanation": "Safety: There are no special hazards in this activity."}, {"id": "tf_8", "type": "truefalse", "statement": "Animal cells have much smaller vacuoles, called vesicles, which also contain solutions.", "correct": true, "explanation": "Animal cells have much smaller vacuoles, called vesicles, which also contain solutions."}, {"id": "tf_9", "type": "truefalse", "statement": "Key idea: plant cells have everything an animal cell has, plus a cell wall, a large permanent vacuole and (often) chloroplasts.", "correct": true, "explanation": "Key idea: plant cells have everything an animal cell has, plus a cell wall, a large permanent vacuole and (often) chloroplasts."}, {"id": "tf_10", "type": "truefalse", "statement": "Cell wall: a thick outer layer, often drawn as a double line, around plant and bacterial cells. An animal cell has only a thin single line (its membrane) around it.", "correct": true, "explanation": "Cell wall: a thick outer layer, often drawn as a double line, around plant and bacterial cells. An animal cell has only a thin single line (its membrane) around it."}, {"id": "tf_11", "type": "truefalse", "statement": "Cell membrane: a thin line around the cytoplasm. In plant cells it lies right against the inside of the wall, so it is hard to see.", "correct": true, "explanation": "Cell membrane: a thin line around the cytoplasm. In plant cells it lies right against the inside of the wall, so it is hard to see."}, {"id": "tf_12", "type": "truefalse", "statement": "Nucleus: a large round or oval body, usually the darkest part of a stained cell.", "correct": true, "explanation": "Nucleus: a large round or oval body, usually the darkest part of a stained cell."}, {"id": "tf_13", "type": "truefalse", "statement": "Large vacuole: a big, clear space in the middle of a plant cell that pushes the cytoplasm and nucleus out to the edges.", "correct": true, "explanation": "Large vacuole: a big, clear space in the middle of a plant cell that pushes the cytoplasm and nucleus out to the edges."}, {"id": "tf_14", "type": "truefalse", "statement": "Chloroplasts: green oval bodies in the cytoplasm of plant cells.", "correct": true, "explanation": "Chloroplasts: green oval bodies in the cytoplasm of plant cells."}]};
let allQ = [];
let idx = 0;
let score = 0;
let answered = 0;

function init() {
  allQ = [...(DATA.mcq||[]), ...(DATA.truefalse||[]), ...(DATA.freeform||[])];
  if (!allQ.length) { document.getElementById('scoreDisplay').textContent = 'No questions available.'; return; }
  idx = 0; score = 0; answered = 0;
  renderAll();
  showQuestion(0);
}

function renderAll() {
  const c = document.getElementById('questionsContainer');
  c.innerHTML = '';
  allQ.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'q_' + i;

    let typeLabel = q.type === 'mcq' ? 'Multiple Choice' : q.type === 'truefalse' ? 'True / False' : 'Written Answer';
    let inner = `<div class="q-number">Question ${i+1} of ${allQ.length}</div>`;
    inner += `<span class="q-type">${typeLabel}</span>`;

    if (q.type === 'mcq') {
      inner += `<div class="q-text">${q.question}</div>`;
      q.options.forEach((o, oi) => {
        inner += `<button class="option" data-qi="${i}" data-oi="${oi}" onclick="answerMCQ(${i},${oi})">${o}</button>`;
      });
      inner += `<div class="explanation" id="expl_${i}">${q.explanation||''}</div>`;
    } else if (q.type === 'truefalse') {
      inner += `<div class="q-text">${q.statement}</div>`;
      inner += `<div class="tf-btns"><button data-qi="${i}" data-val="true" onclick="answerTF(${i},true)">True</button>`;
      inner += `<button data-qi="${i}" data-val="false" onclick="answerTF(${i},false)">False</button></div>`;
      inner += `<div class="explanation" id="expl_${i}">Correct statement: ${q.explanation||''}</div>`;
    } else {
      inner += `<div class="q-text">${q.question}</div>`;
      inner += `<textarea class="freeform-area" id="ans_${i}" placeholder="Type your answer..."></textarea>`;
      inner += `<div class="explanation" id="expl_${i}"><b>Model answer:</b> ${q.answer||''}</div>`;
    }

    inner += `<div class="nav-btns">`;
    if (q.type === 'freeform') inner += `<button class="btn-reveal" onclick="revealFreeform(${i})">Show Answer</button>`;
    else inner += `<span></span>`;
    inner += `<button class="btn-next" id="next_${i}" onclick="nextQ()">${i===allQ.length-1?'Finish':'Next →'}</button>`;
    inner += `</div>`;

    card.innerHTML = inner;
    c.appendChild(card);
  });
}

function showQuestion(n) {
  document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('q_' + n);
  if (card) card.classList.add('active');
  document.getElementById('progressFill').style.width = ((n+1)/allQ.length*100) + '%';
  document.getElementById('scoreDisplay').textContent = `Question ${n+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function answerMCQ(qi, oi) {
  const q = allQ[qi];
  const btns = document.querySelectorAll(`button[data-qi="${qi}"]`);
  btns.forEach(b => { b.disabled = true; b.classList.remove('selected'); });
  btns[oi].classList.add('selected');
  if (oi === q.correct) { btns[oi].classList.add('correct'); score++; }
  else { btns[oi].classList.add('wrong'); btns[q.correct].classList.add('correct'); }
  answered++;
  document.getElementById('expl_' + qi).classList.add('show');
  document.getElementById('scoreDisplay').textContent = `Question ${qi+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function answerTF(qi, val) {
  const q = allQ[qi];
  const btns = document.querySelectorAll(`button[data-qi="${qi}"]`);
  btns.forEach(b => b.disabled = true);
  const correct = val === q.correct;
  btns.forEach(b => {
    if (String(b.dataset.val) === String(q.correct)) b.classList.add('correct');
    if (b.dataset.val === String(val) && !correct) b.classList.add('wrong');
  });
  if (correct) score++;
  answered++;
  document.getElementById('expl_' + qi).classList.add('show');
  document.getElementById('scoreDisplay').textContent = `Question ${qi+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function revealFreeform(qi) {
  document.getElementById('expl_' + qi).classList.add('show');
  answered++;
  document.getElementById('scoreDisplay').textContent = `Question ${qi+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function nextQ() {
  idx++;
  if (idx >= allQ.length) { showResults(); return; }
  showQuestion(idx);
}

function showResults() {
  document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
  const pct = answered > 0 ? Math.round(score/answered*100) : 0;
  document.getElementById('finalScore').textContent = pct + '%';
  let grade = pct >= 90 ? 'Outstanding!' : pct >= 70 ? 'Great work!' : pct >= 50 ? 'Good effort — keep studying!' : 'Review the material and try again.';
  document.getElementById('gradeText').textContent = grade + ` (${score}/${answered} correct)`;
  document.getElementById('resultsCard').style.display = 'block';
  document.getElementById('progressFill').style.width = '100%';
  // Save to localStorage for dashboard
  try {
    const sessions = JSON.parse(localStorage.getItem('sf_quiz_sessions') || '[]');
    sessions.push({ date: new Date().toISOString(), score, total: answered, pct });
    localStorage.setItem('sf_quiz_sessions', JSON.stringify(sessions));
  } catch(e) {}
}

function restart() {
  document.getElementById('resultsCard').style.display = 'none';
  init();
}

init();
</script>
