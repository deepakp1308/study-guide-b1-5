e, with a larger surface area, a steeper concentration gradient and a shorter diffusion distance", "A solution that provides carbon dioxide for aquatic plants; a higher concentration supplies more carbon dioxide", "A tough layer outside the cell membrane; found in the cells of plants, fungi and bacteria"], "correct": 3, "explanation": "A tough layer outside the cell membrane; found in the cells of plants, fungi and bacteria"}, {"id": "term_20", "type": "mcq", "question": "What is the definition of <b>Cellulose</b>?", "options": ["The pH at which an enzyme works fastest; around pH 7 for most enzymes, but about pH 2 for a protease in the stomach", "A polysaccharide that forms criss-crossing fibres; plant cell walls are made mainly of cellulose", "An indicator that is blue in alkaline conditions and loses its colour when the pH becomes less alkaline", "A glass building in which temperature, light and carbon dioxide can be controlled so that crops photosynthesise quickly and give a high yield"], "correct": 1, "explanation": "A polysaccharide that forms criss-crossing fibres; plant cell walls are made mainly of cellulose"}, {"id": "term_21", "type": "mcq", "question": "What is the definition of <b>Fully permeable</b>?", "options": ["A variable that you keep the same throughout an experiment so that it cannot affect the results (also called a control variable)", "The factor in shortest supply (light intensity, carbon dioxide concentration or temperature) that stops the rate of photosynthesis going any higher", "A substance made of two or more different elements chemically combined, e.g. glucose", "Allows all molecules and ions to pass through it"], "correct": 3, "explanation": "Allows all molecules and ions to pass through it"}, {"id": "term_22", "type": "mcq", "question": "What is the definition of <b>Cytoplasm</b>?", "options": ["The outer layer of tissue on a plant; also the outer layer of an animal&#x27;s skin", "The idea that a substrate fits an enzyme&#x27;s active  "question": "What is the definition of <b>Guard cells</b>?", "options": ["A liquid that has a known pH, and keeps that pH steady all the time, even if chemical reactions take place", "A very small vacuole", "The temperature at which an enzyme works fastest; about 37 \u00b0C for enzymes from the human body", "A pair of cells (containing chloroplasts) surrounding each stoma; they change shape to open and close it"], "correct": 3, "explanation": "A pair of cells (containing chloroplasts) surrounding each stoma; they change shape to open and close it"}, {"id": "term_165", "type": "mcq", "question": "What is the definition of <b>Variegated leaf</b>?", "options": ["A leaf that has some white areas (no chlorophyll) and some green areas (with chlorophyll)", "A microscope that shines light through the specimen and uses glass lenses to magnify and focus the image; a very good one magnifies about \u00d71500", "Structures that consist of thousands of starch molecules, stored in some plant cells", "The bottom layer of cells of a leaf; it contains the stomata and usually has no cuticle"], "correct": 0, "explanation": "A leaf that has some white areas (no chlorophyll) and some green areas (with chlorophyll)"}, {"id": "term_166", "type": "mcq", "question": "What is the definition of <b>Destarching</b>?", "options": ["Leaving a plant in the dark for long enough for it to use up its starch stores", "A solution that provides carbon dioxide for aquatic plants; a higher concentration supplies more carbon dioxide", "A description of a plant cell that has lost its turgor pressure and is soft", "The part of an enzyme molecule to which the substrate temporarily binds"], "correct": 0, "explanation": "Leaving a plant in the dark for long enough for it to use up its starch stores"}, {"id": "term_167", "type": "mcq", "question": "What is the definition of <b>Control</b>?", "options": ["A very thin layer of protein and fat surrounding the cytoplasm of every cell; it controls what enters and leaves the cell", "A standard sample that you use as a comparison, to find the effect of changing a variable", "A transparent barrier between a lamp and a plant that lets light through but stops the lamp&#x27;s heat changing the temperature", "A molecule that contains genetic information, in the form of genes, that controls the proteins that are made in the cell"], "correct": 1, "explanation": "A standard sample that you use as a comparison, to find the effect of changing a variable"}, {"id": "term_168", "type": "mcq", "question": "What is the definition of <b>Potassium hydroxide solution</b>?", "options": ["A solution that absorbs carbon dioxide; used to remove carbon dioxide from the air around a leaf", "The part of a plant cell where photosynthesis happens; contains chlorophyll (spread out on membranes) and the enzymes for photosynthesis", "Lipids that are liquid at room temperature", "The lowest to the highest value"], "correct": 0, "explanation": "A solution that absorbs carbon dioxide; used to remove carbon dioxide from the air around a leaf"}, {"id": "term_169", "type": "mcq", "question": "What is the definition of <b>Sodium hydrogencarbonate solution</b>?", "options": ["Structures that consist of thousands of starch molecules, stored in some plant cells", "A solution that provides carbon dioxide for aquatic plants; a higher concentration supplies more carbon dioxide", "The food test for proteins: add biuret solution to the food and shake, with no heating; a violet (purple) colour means protein is present", "The upper layer of tightly packed, transparent cells that reduces water vapour loss and lets light through"], "correct": 1, "explanation": "A solution that provides carbon dioxide for aquatic plants; a higher concentration supplies more carbon dioxide"}, {"id": "term_170", "type": "mcq", "question": "What is the definition of <b>Rate of photosynthesis</b>?", "options": ["A group of organs with related functions, working together to perform body functions", "How much photosynthesis happens in unit time, e.g. the number of oxygen bubbles released by an aquatic plant in one minute", "A very dangerous substance made by many chemical reactions inside cells; catalase must break it down immediately", "The broad, flat part (blade) of a leaf"], "correct": 1, "explanation": "How much photosynthesis happens in unit time, e.g. the number of oxygen bubbles released by an aquatic plant in one minute"}, {"id": "term_171", "type": "mcq", "question": "What is the definition of <b>Limiting factor</b>?", "options": ["The factor in shortest supply (light intensity, carbon dioxide concentration or temperature) that stops the rate of photosynthesis going any higher", "The removal from the body of the waste products of metabolism (unwanted or toxic substances) and of substances in excess of requirements", "A catalyst made by living cells; enzymes are biological catalysts that speed up the reactions inside organisms", "A group of similar cells that work together to perform a particular function"], "correct": 0, "explanation": "The factor in shortest supply (light intensity, carbon dioxide concentration or temperature) that stops the rate of photosynthesis going any higher"}, {"id": "term_172", "type": "mcq", "question": "What is the definition of <b>Heat shield</b>?", "options": ["An enzyme that catalyses the breakdown of maltose to glucose", "Cells with no nucleus; bacteria have prokaryotic cells", "A cell on the surface of a plant root that takes in water and mineral ions from the soil; it uses active transport to take in nitrate ions", "A transparent barrier between a lamp and a plant that lets light through but stops the lamp&#x27;s heat changing the temperature"], "correct": 3, "explanation": "A transparent barrier between a lamp and a plant that lets light through but stops the lamp&#x27;s heat changing the temperature"}, {"id": "term_173", "type": "mcq", "question": "What is the definition of <b>Glasshouse</b>?", "options": ["A glass building in which temperature, light and carbon dioxide can be controlled so that crops photosynthesise quickly and give a high yield", "The food test for fats and oils: shake the food with ethanol, then pour the ethanol into water; a milky white emulsion means fat or oil is present", "The part of a plant cell where photosynthesis happens; contains chlorophyll (spread out on membranes) and the enzymes for photosynthesis", "A thin, transparent, waterproof covering made of a waxy substance, on the upper surface of a leaf"], "correct": 0, "explanation": "A glass building in which temperature, light and carbon dioxide can be controlled so that crops photosynthesise quickly and give a high yield"}, {"id": "term_174", "type": "mcq", "question": "What is the definition of <b>Biofuels</b>?", "options": ["Allows all molecules and ions to pass through it", "Carbon dioxide (from the air) and water (from the soil), which react to make glucose and oxygen", "The surface area of an object divided by its volume; cutting a cube into smaller cubes increases this ratio, so substances diffuse in faster", "Fuels made from plants grown for the purpose, which can be burnt to produce electricity or move vehicles"], "correct": 3, "explanation": "Fuels made from plants grown for the purpose, which can be burnt to produce electricity or move vehicles"}], "freeform": [{"id": "qa_0", "type": "freeform", "question": "Name the part of a cell which has each of these functions:\n\na) makes proteins\n\nb) contains the information for which proteins to make\n\nc) photosynthesis\n\nd) prevents the cell bursting when it takes up water\n\ne) stores a solution of sugars and other solutes\n\nf) controls what enters and leaves the cell.", "answer": "a) Ribosome\n\nb) Nucleus (the DNA in its chromosomes carries the information)\n\nc) Chloroplast\n\nd) Cell wall\n\ne) Vacuole (the large permanent vacuole of a plant cell, which contains cell sap)\n\nf) Cell membrane", "marks": null}, {"id": "qa_1", "type": "freeform", "question": "Which of the structures that you have named in Question B1.05 are found in both animal and plant cells?", "answer": "The ribosome, the nucleus and the cell membrane are found in both animal and plant cells. The chloroplast and the cell wall are found only in plant cells. A large permanent vacuole containing cell sap is also a plant-cell feature; animal cells only have small vacuoles called vesicles.", "marks": null}, {"id": "qa_2", "type": "freeform", "question": "How many micrometres are there in 1 mm?", "answer": "There are 1000 \u00b5m in 1 mm. To convert millimetres to micrometres, multiply by 1000.", "marks": null}, {"id": "qa_3", "type": "freeform", "question": "Identify the characteristic which is not shown by all living organisms. (1 mark)\n\nA) excretion\nB) movement\nC) photosynthesis\nD) respiration", "answer": "C \u2014 photosynthesis. Only plants (and some other organisms such as algae) photosynthesise; animals, fungi and most bacteria do not. Excretion, movement and respiration are three of the seven characteristics shown by all living organisms.", "marks": 1}, {"id": "qa_4", "type": "freeform", "question": "The diagram below shows a cell from a plant leaf. Identify which labelled part contains DNA. (1 mark)\n\nA) the outer double line that forms the boundary of the cell\nB) the small oval structure at the left-hand side of the cell\nC) the narrow layer between the outer boundary and the large central space (top right)\nD) the large central space that fills most of the cell", "answer": "B \u2014 the small oval structure is the nucleus, which contains DNA in the form of chromosomes. (A is the cell wall, C is the cytoplasm and D is the large permanent vacuole.)", "marks": 1}, {"id": "qa_5", "type": "freeform", "question": "A diagram of a flower is 8 cm across. The magnification of the diagram is \u00d74. Identify the actual width of the flower. (1 mark)\n\nA) 3.2 mm\nB) 20 mm\nC) 0.5 cm\nD) 32 cm", "answer": "B \u2014 20 mm. Actual size = size of image \u00f7 magnification = 8 cm \u00f7 4 = 2 cm, and 2 cm \u00d7 10 = 20 mm. D (32 cm) comes from multiplying instead of dividing, and C (0.5 cm) comes from dividing 4 by 8.", "marks": 1}, {"id": "qa_6", "type": "freeform", "question": "These questions are about the diagram in Figure B2.04, which shows a dilute sugar solution (left) separated from a concentrated sugar solution (right) by a membrane with very small pores. What is the solvent in the sugar solution? What is the solute?", "answer": "The solvent is water. The solute is sugar.", "marks": null}, {"id": "qa_7", "type": "freeform", "question": "(Figure B2.04: a dilute sugar solution on the left and a concentrated sugar solution on the right, separated by a partially permeable membrane.) In which direction is the net movement of water molecules?", "answer": "From left to right, from the dilute sugar solution into the concentrated sugar solution. There are more water molecules on the left-hand side, so at any moment more of them hit a pore and pass through from left to right than pass from right to left.", "marks": null}, {"id": "qa_8", "type": "freeform", "question": "Copy and complete this sentence:\n\nWhen an animal cell is placed in pure water, water \u2026\u2026\u2026\u2026\u2026 the cell by \u2026\u2026\u2026\u2026\u2026 through the partially permeable cell \u2026\u2026\u2026\u2026\u2026.", "answer": "When an animal cell is placed in pure water, water enters (moves into) the cell by osmosis through the partially permeable cell membrane.", "marks": null}, {"id": "qa_9", "type": "freeform", "question": "Which element is found in all proteins, but not in carbohydrates and fats?", "answer": "Nitrogen (N). All proteins are made of amino acids, which contain carbon, hydrogen, oxygen and nitrogen, but carbohydrates and fats contain only carbon, hydrogen and oxygen. (Sulfur is found in some proteins, but not in all of them, so it is not the answer.)", "marks": null}, {"id": "qa_10", "type": "freeform", "question": "Identify which elements are contained in starch. (1 mark)\n\nA) carbon and hydrogen only\n\nB) carbon, hydrogen and oxygen\n\nC) carbon, hydrogen and nitrogen\n\nD) carbon, oxygen and nitrogen", "answer": "B \u2014 carbon, hydrogen and oxygen. [1] Starch is a carbohydrate made of many glucose molecules (C\u2086H\u2081\u2082O\u2086), and carbohydrates contain only C, H and O. A is wrong because it leaves out oxygen; C and D are wrong because starch contains no nitrogen (nitrogen is found in proteins).", "marks": 1}, {"id": "qa_11", "type": "freeform", "question": "You read about the enzyme lactase at the start of this chapter.\n\na) What type of enzyme is lactase?\n\nb) Name the substrate of lactase.", "answer": "a) Lactase is a carbohydrase, because it breaks down a carbohydrate (the sugar lactose) into smaller sugar molecules.\n\nb) Lactose, the sugar found in milk.", "marks": null}, {"id": "qa_12", "type": "freeform", "question": "Identify the smaller molecules from which an enzyme molecule is made. (1 mark)\n\nA) amino acids\nB) fatty acids\nC) glucose\nD) glycerol", "answer": "A \u2014 amino acids. Enzymes are proteins, and protein molecules are made from long chains of amino acids [1]. Fatty acids and glycerol are the smaller molecules that make up lipids, and glucose is the smaller molecule that makes up starch.", "marks": 1}, {"id": "qa_13", "type": "freeform", "question": "The figure below shows some stages in an enzyme-controlled reaction. (4 marks)\n\n(The figure shows three stages, from top to bottom. Stage 1: an enzyme molecule (labelled &#x27;enzyme&#x27;) with a dent in one side, labelled Q, and a separate round molecule labelled P. Stage 2: the round molecule fitted into the dent of the enzyme, with the two together labelled R. Stage 3: the enzyme, with its dent empty again, next to the round molecule now split into two pieces, labelled S.)\n\nIdentify the parts labelled", "answer": "P = substrate [1]\n\nQ = active site [1]\n\nR = enzyme\u2013substrate complex [1]\n\nS = products (the product molecules) [1]", "marks": 4}, {"id": "qa_14", "type": "freeform", "question": "Animals do not make or store starch. What is the substance that animals store, which is made of chains of glucose molecules?", "answer": "Glycogen (stored mainly in the liver and muscles).", "marks": null}, {"id": "qa_15", "type": "freeform", "question": "Figure B5.10 shows a photomicrograph (\u00d7400) of a small part of a leaf from a tea plant. Identify structures A\u2013D.\n\nDescription of Figure B5.10: label A points to the row of cells forming the top surface of the leaf; label B points to the layer of tall, narrow cells packed side by side just below it; label C points to the region of rounded, loosely arranged cells with spaces between them in the lower part of the leaf; label D points up to a gap in the bottom row of cells, with a large space just a", "answer": "A \u2014 upper epidermis (covered on the outside by the thin cuticle)\n\nB \u2014 palisade mesophyll\n\nC \u2014 spongy mesophyll\n\nD \u2014 a stoma (the opening between two guard cells in the lower epidermis)", "marks": null}, {"id": "qa_16", "type": "freeform", "question": "Identify the raw materials required for photosynthesis. (1 mark)\n\nA) carbon dioxide and oxygen\nB) oxygen and glucose\nC) glucose and water\nD) water and carbon dioxide", "answer": "D \u2014 water and carbon dioxide. These are the reactants of photosynthesis. Oxygen and glucose are the products, so options A, B and C are wrong.", "marks": 1}, {"id": "qa_17", "type": "freeform", "question": "Identify which ion a plant requires to make amino acids from glucose. (1 mark)\n\nA) calcium\nB) iron\nC) magnesium\nD) nitrate", "answer": "D \u2014 nitrate. Amino acids contain nitrogen, which glucose does not. Plants absorb nitrogen from the soil as nitrate ions and combine it with glucose to make amino acids. Magnesium ions are needed to make chlorophyll, not amino acids.", "marks": 1}], "truefalse": [{"id": "tf_0", "type": "truefalse", "statement": "Animal cells have much smaller vacuoles, called vesicles, which also contain solutions.", "correct": true, "explanation": "Animal cells have much smaller vacuoles, called vesicles, which also contain solutions."}, {"id": "tf_1", "type": "truefalse", "statement": "Root hair cell: has a long, thin extension (the root hair), which gives a large surface area for absorbing water and mineral ions from the soil.", "correct": true, "explanation": "Root hair cell: has a long, thin extension (the root hair), which gives a large surface area for absorbing water and mineral ions from the soil."}, {"id": "tf_2", "type": "truefalse", "statement": "Multiplying instead of dividing: to find the actual size you divide the image size by the magnification. Multiplying 8 cm by 4 to get 32 cm is the trap in Practice Question 4.", "correct": true, "explanation": "Multiplying instead of dividing: to find the actual size you divide the image size by the magnification. Multiplying 8 cm by 4 to get 32 cm is the trap in Practice Question 4."}, {"id": "tf_3", "type": "truefalse", "statement": "Net movement means overall or average movement. Some molecules go from the egg into the room and a few go from the room back into the egg, but overall most of them go from the egg into the room.", "correct": true, "explanation": "Net movement means overall or average movement. Some molecules go from the egg into the room and a few go from the room back into the egg, but overall most of them go from the egg into the room."}, {"id": "tf_4", "type": "truefalse", "statement": "Compound \u2014 a substance made of two or more different elements chemically combined", "correct": true, "explanation": "Compound \u2014 a substance made of two or more different elements chemically combined"}, {"id": "tf_5", "type": "truefalse", "statement": "Benedict&#x27;s solution is blue. It changes colour when it is heated with reducing sugars, such as glucose", "correct": true, "explanation": "Benedict&#x27;s solution is blue. It changes colour when it is heated with reducing sugars, such as glucose"}, {"id": "tf_6", "type": "truefalse", "statement": "Energy stores: fats are used as energy stores, and fat stores contain more energy per gram than carbohydrate stores", "correct": true, "explanation": "Energy stores: fats are used as energy stores, and fat stores contain more energy per gram than carbohydrate stores"}, {"id": "tf_7", "type": "truefalse", "statement": "Protein molecules: made up of different sequences of amino acids. Use different colours or shapes for different amino acids, and show that changing the order makes a different protein", "correct": true, "explanation": "Protein molecules: made up of different sequences of amino acids. Use different colours or shapes for different amino acids, and show that changing the order makes a different protein"}, {"id": "tf_8", "type": "truefalse", "statement": "Temperature. Enzymes have an optimum temperature at which they work fastest:", "correct": true, "explanation": "Temperature. Enzymes have an optimum temperature at which they work fastest:"}, {"id": "tf_9", "type": "truefalse", "statement": "H\u2082O (water): one molecule contains 2 atoms of hydrogen (H) and 1 atom of oxygen", "correct": true, "explanation": "H\u2082O (water): one molecule contains 2 atoms of hydrogen (H) and 1 atom of oxygen"}, {"id": "tf_10", "type": "truefalse", "statement": "Lower epidermis \u2014 the row of cells on the bottom surface. Look for a gap (a stoma) between two small guard cells, usually with a large air space just above it.", "correct": true, "explanation": "Lower epidermis \u2014 the row of cells on the bottom surface. Look for a gap (a stoma) between two small guard cells, usually with a large air space just above it."}, {"id": "tf_11", "type": "truefalse", "statement": "Used to make amino acids and then proteins [1] \u2014 glucose is combined with nitrogen from nitrate ions; the proteins are needed for growth [1].", "correct": true, "explanation": "Used to make amino acids and then proteins [1] \u2014 glucose is combined with nitrogen from nitrate ions; the proteins are needed for growth [1]."}, {"id": "tf_12", "type": "truefalse", "statement": "Identify: name/select/recognise.", "correct": true, "explanation": "Identify: name/select/recognise."}, {"id": "tf_13", "type": "truefalse", "statement": "Compare: identify or comment on similarities and/or differences.", "correct": true, "explanation": "Compare: identify or comment on similarities and/or differences."}, {"id": "tf_14", "type": "truefalse", "statement": "Time versus rate: if a table gives times, remember that the shortest time shows the highest activity.", "correct": true, "explanation": "Time versus rate: if a table gives times, remember that the shortest time shows the highest activity."}]};
let allQ = [];
let idx = 0;
let score = 0;
let answered = 0;

function init() {
  allQ = [...(DATA.mcq||[]), ...(DATA.truefalse||[]), ...(DATA.freeform||[])];
  if (!allQ.length) { document.getElementById('scoreDisplay').textContent = 'No questions available.'; return; }
  idx = 0; score = 0; answered = 0;
  renderAll();
  showQuestion(0);
}

function renderAll() {
  const c = document.getElementById('questionsContainer');
  c.innerHTML = '';
  allQ.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'q_' + i;

    let typeLabel = q.type === 'mcq' ? 'Multiple Choice' : q.type === 'truefalse' ? 'True / False' : 'Written Answer';
    let inner = `<div class="q-number">Question ${i+1} of ${allQ.length}</div>`;
    inner += `<span class="q-type">${typeLabel}</span>`;

    if (q.type === 'mcq') {
      inner += `<div class="q-text">${q.question}</div>`;
      q.options.forEach((o, oi) => {
        inner += `<button class="option" data-qi="${i}" data-oi="${oi}" onclick="answerMCQ(${i},${oi})">${o}</button>`;
      });
      inner += `<div class="explanation" id="expl_${i}">${q.explanation||''}</div>`;
    } else if (q.type === 'truefalse') {
      inner += `<div class="q-text">${q.statement}</div>`;
      inner += `<div class="tf-btns"><button data-qi="${i}" data-val="true" onclick="answerTF(${i},true)">True</button>`;
      inner += `<button data-qi="${i}" data-val="false" onclick="answerTF(${i},false)">False</button></div>`;
      inner += `<div class="explanation" id="expl_${i}">Correct statement: ${q.explanation||''}</div>`;
    } else {
      inner += `<div class="q-text">${q.question}</div>`;
      inner += `<textarea class="freeform-area" id="ans_${i}" placeholder="Type your answer..."></textarea>`;
      inner += `<div class="explanation" id="expl_${i}"><b>Model answer:</b> ${q.answer||''}</div>`;
    }

    inner += `<div class="nav-btns">`;
    if (q.type === 'freeform') inner += `<button class="btn-reveal" onclick="revealFreeform(${i})">Show Answer</button>`;
    else inner += `<span></span>`;
    inner += `<button class="btn-next" id="next_${i}" onclick="nextQ()">${i===allQ.length-1?'Finish':'Next →'}</button>`;
    inner += `</div>`;

    card.innerHTML = inner;
    c.appendChild(card);
  });
}

function showQuestion(n) {
  document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('q_' + n);
  if (card) card.classList.add('active');
  document.getElementById('progressFill').style.width = ((n+1)/allQ.length*100) + '%';
  document.getElementById('scoreDisplay').textContent = `Question ${n+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function answerMCQ(qi, oi) {
  const q = allQ[qi];
  const btns = document.querySelectorAll(`button[data-qi="${qi}"]`);
  btns.forEach(b => { b.disabled = true; b.classList.remove('selected'); });
  btns[oi].classList.add('selected');
  if (oi === q.correct) { btns[oi].classList.add('correct'); score++; }
  else { btns[oi].classList.add('wrong'); btns[q.correct].classList.add('correct'); }
  answered++;
  document.getElementById('expl_' + qi).classList.add('show');
  document.getElementById('scoreDisplay').textContent = `Question ${qi+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function answerTF(qi, val) {
  const q = allQ[qi];
  const btns = document.querySelectorAll(`button[data-qi="${qi}"]`);
  btns.forEach(b => b.disabled = true);
  const correct = val === q.correct;
  btns.forEach(b => {
    if (String(b.dataset.val) === String(q.correct)) b.classList.add('correct');
    if (b.dataset.val === String(val) && !correct) b.classList.add('wrong');
  });
  if (correct) score++;
  answered++;
  document.getElementById('expl_' + qi).classList.add('show');
  document.getElementById('scoreDisplay').textContent = `Question ${qi+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function revealFreeform(qi) {
  document.getElementById('expl_' + qi).classList.add('show');
  answered++;
  document.getElementById('scoreDisplay').textContent = `Question ${qi+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function nextQ() {
  idx++;
  if (idx >= allQ.length) { showResults(); return; }
  showQuestion(idx);
}

function showResults() {
  document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
  const pct = answered > 0 ? Math.round(score/answered*100) : 0;
  document.getElementById('finalScore').textContent = pct + '%';
  let grade = pct >= 90 ? 'Outstanding!' : pct >= 70 ? 'Great work!' : pct >= 50 ? 'Good effort — keep studying!' : 'Review the material and try again.';
  document.getElementById('gradeText').textContent = grade + ` (${score}/${answered} correct)`;
  document.getElementById('resultsCard').style.display = 'block';
  document.getElementById('progressFill').style.width = '100%';
  // Save to localStorage for dashboard
  try {
    const sessions = JSON.parse(localStorage.getItem('sf_quiz_sessions') || '[]');
    sessions.push({ date: new Date().toISOString(), score, total: answered, pct });
    localStorage.setItem('sf_quiz_sessions', JSON.stringify(sessions));
  } catch(e) {}
}

function restart() {
  document.getElementById('resultsCard').style.display = 'none';
  init();
}

init();
</script>
