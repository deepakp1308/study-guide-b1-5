<script>
const EXAM = {"title": "Biology Chapters B1\u2013B5 \u2014 Cambridge IGCSE Biology Study Guide", "timeMinutes": 45, "questions": [{"id": "Question B1.01", "question": "A student claimed that plants show fewer of the characteristics of living things than animals. Explain why this claim is wrong.", "answer": "The claim is wrong because plants, like all living organisms, show all seven characteristics of living things. Plants simply carry out some of them more slowly or less obviously than animals, which may be why the student was misled.\n- Movement: plants cannot move their whole body from place to place, but they slowly move parts of themselves; for example, many flowers open during the day and close at night.\n- Respiration: every living plant cell respires all the time, day and night, releasing energy from glucose.\n- Sensitivity: plants detect and respond to changes in their environment; for example, shoots grow towards light.\n- Growth: plants grow throughout their lives, with a permanent increase in size and dry mass.\n- Reproduction: plants make new plants of the same species, for example fr", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B1.02", "question": "Consider two organisms. For each, identify:\n\na) the characteristics of living things that the organism carries out all the time\n\nb) the characteristics of living things that only happen at certain times.", "answer": "Answers depend on the organisms you choose. This example uses a human and a mango tree.\n\na) Human: respiration (every cell respires all the time), excretion (carbon dioxide leaves in every breath out, and the kidneys make urine continuously) and sensitivity (the body is always detecting changes, such as in blood temperature). Mango tree: respiration (all its living cells, day and night), excretion (waste gases leave through the leaves) and sensitivity (it is always detecting light and gravity).\n\nb) Human: growth (mainly until adulthood), reproduction (only adults, and only occasionally), nutrition (we take in food at mealtimes) and movement of the whole body (only when we choose to move). Mango tree: nutrition by photosynthesis (only in daylight), growth (mainly in the growing season), rep", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B1.03", "question": "Explain the difference between a unicellular organism and a multicellular organism, giving one example of each.", "answer": "A unicellular organism is made of just one cell, which carries out all the characteristics of life by itself; an example is a bacterium (or yeast). A multicellular organism is made of many cells (large organisms contain millions of cells), and different cells can become specialised to carry out particular functions; an example is a human (or a plant such as a mango tree).", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B1.04", "question": "Look at the micrographs in Figures B1.05 and B1.06. Suggest why a stain has been added to the animal cells, but we can easily see the plant cells without using a stain.", "answer": "Animal cells do not have any coloured parts: the cytoplasm is a clear jelly and the cell membrane is very thin, so the cells and their structures are very difficult to see. The stain colours the cells and makes the nucleus look darker than the cytoplasm, so the structures show up. The moss plant cells contain green chloroplasts, which are already coloured, and their cell walls stand out clearly because they are much thicker than the animal cell membranes. So the plant cells can be seen easily without a stain.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B1.05", "question": "Name the part of a cell which has each of these functions:\n\na) makes proteins\n\nb) contains the information for which proteins to make\n\nc) photosynthesis\n\nd) prevents the cell bursting when it takes up water\n\ne) stores a solution of sugars and other solutes\n\nf) controls what enters and leaves the cell.", "answer": "a) Ribosome\n\nb) Nucleus (the DNA in its chromosomes carries the information)\n\nc) Chloroplast\n\nd) Cell wall\n\ne) Vacuole (the large permanent vacuole of a plant cell, which contains cell sap)\n\nf) Cell membrane", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B1.06", "question": "Which of the structures that you have named in Question B1.05 are found in both animal and plant cells?", "answer": "The ribosome, the nucleus and the cell membrane are found in both animal and plant cells. The chloroplast and the cell wall are found only in plant cells. A large permanent vacuole containing cell sap is also a plant-cell feature; animal cells only have small vacuoles called vesicles.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B1.07", "question": "Construct a table to compare the structure of a bacterial cell with animal and plant cells. Remember to include similarities as well as differences.", "answer": "| Feature | Bacterial cell | Animal cell | Plant cell |\n|---|---|---|---|\n| Cell membrane | Yes (partially permeable, pressed against the cell wall) | Yes | Yes |\n| Cell wall | Yes, but not made of cellulose | No | Yes, made of cellulose |\n| Cytoplasm | Yes | Yes | Yes |\n| Ribosomes | Yes | Yes | Yes |\n| Nucleus | No | Yes | Yes |\n| DNA | A single circle of DNA in the cytoplasm | In chromosomes inside the nucleus (not circular) | In chromosomes inside the nucleus (not circular) |\n| Plasmids | Often present | No | No |\n| Mitochondria | No | Yes | Yes |\n| Chloroplasts | No | No | Often, in the green parts of the plant |\n| Large permanent vacuole containing cell sap | No | No (only small vesicles) | Yes |\n\nSimilarities: all three types of cell have a cell membrane, cytoplasm, ribosomes and DN", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B1.08", "question": "How many micrometres are there in 1 mm?", "answer": "There are 1000 \u00b5m in 1 mm. To convert millimetres to micrometres, multiply by 1000.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B1.09", "question": "The mitochondrion in Figure B1.10 is magnified 20 000 times. (Figure B1.10 is an electron micrograph of one long, oval mitochondrion that stretches almost the whole width of the picture.)\n\na) Using a ruler, carefully measure the maximum length of the mitochondrion. Record your measurement in mm (millimetres).\n\nb) Convert your answer to \u00b5m (micrometres).\n\nc) Use this formula to calculate the real size of the mitochondrion in \u00b5m: Real size in \u00b5m = size of image in \u00b5m \u00f7 magnification\n\nd) How many of these mitochondria could you line up end to end between two of the mm marks on your ruler?", "answer": "a) About 83 mm, measured in a straight line from one end of the mitochondrion to the other along its longest axis. If your own careful measurement is a millimetre or two different, use your value in parts b to d.\n\nb) 83 mm \u00d7 1000 = 83 000 \u00b5m\n\nc) Real size = 83 000 \u00b5m \u00f7 20 000 = 4.15 \u00b5m\n\nd) The gap between two mm marks is 1 mm = 1000 \u00b5m. Number of mitochondria = 1000 \u00b5m \u00f7 4.15 \u00b5m = 240.96, so about 241 mitochondria (240 whole ones would fit completely).", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B1.P1", "question": "Identify the characteristic which is not shown by all living organisms. (1 mark)\n\nA) excretion\nB) movement\nC) photosynthesis\nD) respiration", "answer": "C \u2014 photosynthesis. Only plants (and some other organisms such as algae) photosynthesise; animals, fungi and most bacteria do not. Excretion, movement and respiration are three of the seven characteristics shown by all living organisms.", "marks": 1, "hasImage": false, "imagePath": null}, {"id": "Question B1.P2", "question": "The tongue-eating louse is a parasite of large fish. As its name suggests, it has an unusual way of gaining nutrition. It detects chemicals on the gills of a fish. From the gills it crawls into the fish&#x27;s mouth. First, the louse sucks blood from the tongue. This causes the tongue to shrink and eventually fall off. Next, the louse takes the place of the tongue. Here the louse remains, feeding on food that the fish takes into its mouth. (7 marks)\n\na) Define nutrition. [2]\n\nb) Apart from nutrition, explain how two features of the louse are characteristics of all living organisms. [2]\n\nc) The tongue-eating louse can reproduce.\n\ni) Define reproduction. [2]\n\nii) Suggest one reason why scientists know very little about the process of reproduction in this species. [1]", "answer": "a) Taking in substances (materials) from the environment [1]; and using them for energy, growth and development [1].\n\nb) Sensitivity: the louse detects chemicals on the gills of a fish, so it detects and responds to a change in its environment [1]. Movement: the louse crawls from the gills into the fish&#x27;s mouth, so it changes its position [1].\n\nc) i) The processes that make new organisms [1]; of the same species (the same kind of organism) [1].\n\nc) ii) Any one sensible reason [1], for example: it lives hidden inside the mouths of fish in the sea, so it is very hard to observe; it spends very little time outside its host; it is rare in the wild; it is difficult to keep and breed in a laboratory.", "marks": 7, "hasImage": false, "imagePath": null}, {"id": "Question B1.P3", "question": "The diagram below shows a cell from a plant leaf. Identify which labelled part contains DNA. (1 mark)\n\nA) the outer double line that forms the boundary of the cell\nB) the small oval structure at the left-hand side of the cell\nC) the narrow layer between the outer boundary and the large central space (top right)\nD) the large central space that fills most of the cell", "answer": "B \u2014 the small oval structure is the nucleus, which contains DNA in the form of chromosomes. (A is the cell wall, C is the cytoplasm and D is the large permanent vacuole.)", "marks": 1, "hasImage": false, "imagePath": null}, {"id": "Question B1.P4", "question": "A diagram of a flower is 8 cm across. The magnification of the diagram is \u00d74. Identify the actual width of the flower. (1 mark)\n\nA) 3.2 mm\nB) 20 mm\nC) 0.5 cm\nD) 32 cm", "answer": "B \u2014 20 mm. Actual size = size of image \u00f7 magnification = 8 cm \u00f7 4 = 2 cm, and 2 cm \u00d7 10 = 20 mm. D (32 cm) comes from multiplying instead of dividing, and C (0.5 cm) comes from dividing 4 by 8.", "marks": 1, "hasImage": false, "imagePath": null}, {"id": "Question B1.P5", "question": "The photograph shows a jellyfish. A jellyfish belongs to the animal kingdom. (9 marks)\n\n(The photograph is a black-and-white side view of a jellyfish: a see-through, dome-shaped bell with a frilly edge and short fringes hanging underneath. Measured across its widest part, the jellyfish in the printed photograph is 89 mm wide.)\n\na) The actual jellyfish is 50 mm in diameter. Calculate the magnification of the photograph. [3]\n\nb) State three parts that you would find in a cell in a jellyfish and outline the function of each part. [6]", "answer": "a) Magnification = size of image \u00f7 size of actual object [1]; = 89 mm \u00f7 50 mm [1]; = 1.78, so the magnification is \u00d71.8 to 2 significant figures [1]. The answer must have a \u00d7 sign and no units. If your own measurement of the photograph is slightly different, use it in the same way.\n\nb) Any three parts, each with its function (1 mark for the part and 1 mark for its function):\n- Nucleus [1]: contains DNA in the form of chromosomes, carrying the information about which proteins the cell makes [1]\n- Cell membrane [1]: partially permeable; controls what enters and leaves the cell [1]\n- Cytoplasm [1]: the jelly where many metabolic reactions take place [1]\n- Mitochondrion [1]: the site of aerobic respiration, which releases energy from glucose [1]\n- Ribosome [1]: where proteins are made [1]\n\nDo ", "marks": 9, "hasImage": false, "imagePath": null}, {"id": "Question B1.P6", "question": "This is an electron micrograph of a small part of a cell from the pancreas. This cell makes large quantities of protein molecules, which are stored in vesicles before being exported from the cell. (8 marks)\n\n(In the micrograph, label A points to a large, pale, finely grainy area at the top left. Label B points to a long, pale, sausage-shaped structure in the centre with fine stripes across its inside. Label C points to the dark, closely packed wavy lines that fill most of the background. Several round, dark grey structures are labelled &#x27;vesicle containing protein molecules made by the cell&#x27;.)\n\na) Structure A contains molecules that determine the type of proteins made in the cell. Identify structure A. [1]\n\nb) Use the information above to explain why the cell has large numbers of structures", "answer": "a) The nucleus [1].\n\nb) Any six from:\n- B is a mitochondrion [1]\n- Mitochondria are the site of aerobic respiration [1]\n- Aerobic respiration releases energy from glucose [1] (do not write that mitochondria produce energy)\n- Making (synthesising) proteins requires energy [1], and so does moving the vesicles and exporting the proteins from the cell\n- C shows ribosomes; the dark, grainy lines are membranes covered in ribosomes [1]\n- Ribosomes are the site of protein synthesis, where amino acids are linked together to make proteins [1]\n- The cell makes large quantities of protein, so it needs many ribosomes to make them and many mitochondria to supply the energy [1]\n\nc) Any one [1]: the cell has a nucleus (A); it has mitochondria (B); it has vesicles. Bacterial cells have no nucleus, no mitoc", "marks": 8, "hasImage": false, "imagePath": null}, {"id": "Question B2.01", "question": "Look at the definition of diffusion in the &#x27;Key words&#x27; box at the start of this section. Explain why the following conditions are required for diffusion to occur:\n\na) movement of particles\n\nb) a concentration gradient\n\nc) random movement.", "answer": "a) Diffusion is the net movement of particles from one place to another, so the particles must be able to move. Their movement comes from their kinetic energy. If the particles could not move (for example, if they were held in fixed positions as in a solid), they could never spread out from a region of high concentration, so diffusion could not happen.\n\nb) Diffusion is net movement from a region of higher concentration to a region of lower concentration, so there must be a difference in concentration. If the concentration were the same everywhere, the particles would still move about, but just as many would move one way as the other, so there would be no net movement and no diffusion.\n\nc) The particles do not move purposefully towards the low concentration; they move randomly in all direct", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B2.02", "question": "When substances diffuse into and out of cells, which part of the cell must they move through?", "answer": "They must move through the cell membrane. The cell membrane surrounds every cell, so any substance entering or leaving the cell has to cross it. (In a plant cell, substances also pass through the cell wall, but the cell wall is fully permeable, so it is the cell membrane that controls what enters and leaves.)", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B2.03", "question": "These questions are about the diagram in Figure B2.04, which shows a dilute sugar solution (left) separated from a concentrated sugar solution (right) by a membrane with very small pores. What is the solvent in the sugar solution? What is the solute?", "answer": "The solvent is water. The solute is sugar.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B2.04", "question": "(Figure B2.04: a dilute sugar solution and a concentrated sugar solution separated by a membrane with very small pores.) Explain why water molecules can move from one side of the membrane to the other, but sugar molecules cannot.", "answer": "The membrane has very small holes (pores) in it. Water molecules are very small (each is made of just two hydrogen atoms and one oxygen atom), so they can fit through the pores. Sugar molecules are many times larger than water molecules, so they are too big to pass through the pores. The membrane is partially permeable: it lets water through but not sugar.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B2.05", "question": "(Figure B2.04: a dilute sugar solution on the left and a concentrated sugar solution on the right, separated by a partially permeable membrane.) In which direction is the net movement of water molecules?", "answer": "From left to right, from the dilute sugar solution into the concentrated sugar solution. There are more water molecules on the left-hand side, so at any moment more of them hit a pore and pass through from left to right than pass from right to left.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B2.06", "question": "In Figure B2.04, which solution has the higher water potential? Explain your answer.", "answer": "The dilute sugar solution (on the left) has the higher water potential. It contains more water molecules, because less of its space is taken up by sugar molecules, and a solution with a lot of water has a high water potential. The concentrated solution on the right contains less water, so it has a lower water potential.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B2.07", "question": "Copy and complete this sentence:\n\nWhen an animal cell is placed in pure water, water \u2026\u2026\u2026\u2026\u2026 the cell by \u2026\u2026\u2026\u2026\u2026 through the partially permeable cell \u2026\u2026\u2026\u2026\u2026.", "answer": "When an animal cell is placed in pure water, water enters (moves into) the cell by osmosis through the partially permeable cell membrane.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B2.08", "question": "Animal cells burst if they are placed in pure water, but plant cells do not. Explain why.", "answer": "Both kinds of cell take in water by osmosis in pure water, because the pure water has a higher water potential than the cytoplasm and the cell membrane is partially permeable. As water enters, the cell contents swell. An animal cell is surrounded only by its thin cell membrane, which stretches as the cell swells until the strain is too much and the cell bursts. A plant cell has a very strong cell wall outside its cell membrane. As the cytoplasm and vacuole swell, they press outwards on the cell wall, but the wall resists and presses back on the contents (turgor pressure). This stops the cell expanding any further, so the plant cell becomes turgid instead of bursting.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B2.09", "question": "Here are some descriptions of what happens to a plant cell when it is placed in a concentrated solution. They are in the wrong order. Write the descriptions in the correct order.\n- The cytoplasm and vacuole shrink.\n- The cell membrane is pulled away from the cell wall.\n- Water moves out of the cell through the partially permeable cell membrane.", "answer": "The correct order is:\n1. Water moves out of the cell through the partially permeable cell membrane.\n2. The cytoplasm and vacuole shrink.\n3. The cell membrane is pulled away from the cell wall.\n\nWater leaving the cell is what makes the cytoplasm and vacuole shrink, and because the strong cell wall stays in position, the shrinking contents pull the cell membrane away from the wall.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B2.10", "question": "Look at Figure B2.09, which shows a plant cell in a concentrated solution: the cytoplasm and vacuole have shrunk and the cell membrane has pulled away from the cell wall, leaving a gap labelled space X between the cell wall and the cell membrane. What fills space X? Explain your answer.", "answer": "Space X is filled with the concentrated solution from outside the cell. The cell wall is fully permeable, so the outside solution (water and its dissolved solute) passes straight through it. When the cytoplasm and vacuole shrink and the cell membrane pulls away from the wall, the outside solution moves through the wall and fills the gap between the cell wall and the cell membrane. It is not cytoplasm, because the cytoplasm stays inside the cell membrane, and it is not air.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B2.11", "question": "A group of plant cells has been placed in a concentrated solution, and the cells are plasmolysed. Predict what will happen if the cells are now placed in pure water. Explain your answer, using the term water potential.", "answer": "The cells will take up water by osmosis and become turgid again (as long as they have not been killed). Pure water has a higher water potential than the cell contents, because the cytoplasm and the solution in the vacuole are concentrated solutions with a low water potential. So water moves into the cells down the water potential gradient, through the partially permeable cell membranes. The cytoplasm and vacuole swell, the cell membrane is pushed back against the cell wall, and turgor pressure builds up, so the cells become turgid. However, if a cell membrane was badly damaged when it tore away from the cell wall, that cell may have died; its membrane would no longer be partially permeable, so it would not become turgid again.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B2.P1", "question": "Identify which change would increase the rate at which a substance diffuses across a membrane. (1 mark)\n\nA) a decrease in concentration gradient\nB) a decrease in the surface area of the membrane\nC) an increase in distance across the membrane\nD) an increase in temperature", "answer": "D \u2014 an increase in temperature. At a higher temperature, particles have more kinetic energy, so their random movement is faster and diffusion is faster [1]. A, B and C would all slow diffusion down: a smaller concentration gradient, a smaller surface area and a longer diffusion distance all decrease the rate of diffusion.", "marks": 1, "hasImage": false, "imagePath": null}, {"id": "Question B2.P2", "question": "The table shows information about diffusion, osmosis and active transport. Identify which row is correct. (1 mark)\n\nEach option is one row of the table, giving the entries for diffusion, osmosis and active transport in that order:\n\nA) Diffusion: uses energy from respiration. Osmosis: always involves a partially permeable membrane. Active transport: uses protein carriers in membranes.\nB) Diffusion: uses kinetic energy of molecules and ions. Osmosis: uses kinetic energy of water molecules. Active transport: involves movement up a concentration gradient.\nC) Diffusion: uses protein carriers in membranes. Osmosis: involves movement up a concentration gradient. Active transport: always involves a partially permeable membrane.\nD) Diffusion: always involves a partially permeable membrane. Osmosis:", "answer": "B [1]. Diffusion is powered by the kinetic energy of the moving molecules and ions; osmosis is the diffusion of water, so it is powered by the kinetic energy of the water molecules; and active transport moves substances up (against) a concentration gradient. The other rows are wrong:\n- A is wrong because diffusion does not use energy from respiration.\n- C is wrong because diffusion does not use protein carriers, and osmosis moves water from a high to a low water potential, not up a gradient.\n- D is wrong because diffusion does not need a membrane at all (for example, a gas spreading through a room), and osmosis does not use protein carriers.", "marks": 1, "hasImage": false, "imagePath": null}, {"id": "Question B2.P3", "question": "A learner investigated how temperature affected the rate at which a dye moved through a piece of agar jelly. (11 marks)\n\nShe filled seven test-tubes with a solution of red dye. She placed each tube into a water-bath at a different temperature and left them for ten minutes.\n\nShe cut seven cubes of jelly. She placed each cube into one of the tubes containing the red dye. She measured the time taken for the cubes to change colour.\n\nThis graph shows her results. It plots Time taken / minutes (y-axis, 0 to 12) against Temperature / \u00b0C (x-axis, 0 to 60). There are seven plotted points and a straight line of best fit that slopes downwards from about 12 minutes at 0 \u00b0C to below 1 minute at 60 \u00b0C. Approximate values read from the graph:\n\n| Temperature / \u00b0C | 0 | 10 | 20 | 30 | 40 | 50 | 60 |\n|---|-", "answer": "a) Diffusion [1]. The net movement of dye particles (molecules) from a region of higher concentration (the dye solution) to a region of lower concentration (the jelly), i.e. down a concentration gradient [1]; as a result of the random movement of the particles, which comes from their kinetic energy [1].\n\nb) So that the dye solution in each tube had time to reach the temperature of its water-bath before the jelly cube was added, so the dye was at the temperature being tested [1].\n\nc) Any two of [1 each, maximum 2]: the size of the jelly cubes (same side length, so the same volume and surface area); the concentration of the dye solution; the volume of dye solution in each tube; the type of jelly (all cubes cut from the same batch); how the colour change is judged (the same end-point each tim", "marks": 11, "hasImage": false, "imagePath": null}, {"id": "Question B2.P4", "question": "(8 marks)\n\na) Describe what is meant by osmosis. [2]\n\nb) Compare the effect of immersing an animal cell and a plant cell in pure water. Explain the reasons for any differences that you describe. [6]", "answer": "a) The net movement (diffusion) of water molecules [1] from a region of higher water potential (dilute solution) to a region of lower water potential (concentrated solution) through a partially permeable membrane [1].\n\nb) Any six of these points [1 each, maximum 6]:\n- Similarity: both cells take in water by osmosis.\n- Because the pure water has a higher water potential than the cytoplasm, water moves down a water potential gradient into the cell.\n- In both cells, water enters through the partially permeable cell membrane.\n- In both cells, the contents swell (the cytoplasm, and in the plant cell also the vacuole).\n- Difference: the animal cell keeps swelling until it bursts.\n- Reason: the animal cell has no cell wall; its thin cell membrane stretches until the strain is too much and it brea", "marks": 8, "hasImage": false, "imagePath": null}, {"id": "Question B2.P5", "question": "This bar chart shows the concentration of potassium ions and sodium ions in a sample of pond water, and in the cells of a plant growing in the water. (9 marks)\n\nThe y-axis shows Concentration / arbitrary units (0 to 4) and the x-axis shows the ion (potassium and sodium). Light bars show pond water and dark bars show plant cells. Bar heights read from the chart:\n\n| Ion | Pond water / arbitrary units | Plant cells / arbitrary units |\n|-----|------------------------------|-------------------------------|\n| Potassium | 0.5 | 4.0 |\n| Sodium | 0.5 | about 0.05 (a very short bar, almost zero) |\n\na) Describe the differences between the concentrations of the ions in the pond water and in the plant cells. [3]\n\nb) Use the data in the graph to suggest how the ions move between the pond water and the p", "answer": "a) Any three of [1 each, maximum 3]:\n- The concentration of potassium ions is much higher in the plant cells (4.0 arbitrary units) than in the pond water (0.5 arbitrary units), about 8 times higher.\n- The concentration of sodium ions is lower in the plant cells (about 0.05 arbitrary units) than in the pond water (0.5 arbitrary units).\n- In the pond water, the concentrations of potassium and sodium ions are the same (0.5 arbitrary units each).\n- In the plant cells, there is far more potassium than sodium (4.0 compared with about 0.05).\n\nb) Potassium ions are moved into the plant cells by active transport [1], because they have to move from a lower concentration in the pond water to a higher concentration in the cells, which is against their concentration gradient; diffusion alone would make", "marks": 9, "hasImage": false, "imagePath": null}, {"id": "Question B3.01", "question": "Name one carbohydrate that is found in both plants and animals.", "answer": "Glucose. Plants make glucose in photosynthesis, and both plants and animals use glucose in respiration to release energy; in humans it is the form in which carbohydrate is transported in the blood plasma. (Starch is found only in plants and glycogen only in animals, so neither of these is a correct answer.)", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B3.02", "question": "Animals that live in very cold places often have especially thick layers of fat underneath the skin (Figure B3.08). Suggest why.\n\n(Figure B3.08: Bearded seals have a really thick layer of fat underneath their skin.)", "answer": "The thick layer of fat under the skin acts as a heat insulating layer. Fat is a poor conductor of heat, so it reduces the amount of heat lost from the animal&#x27;s warm body to its very cold surroundings, helping it to keep its body temperature high and constant. The fat is also an energy store: when food is scarce, the animal can use it in respiration to release energy, including heat to keep warm.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B3.03", "question": "Fat stores contain more energy per gram than carbohydrate stores. Suggest why birds that are about to go on long migrations build up stores of fat before they fly.", "answer": "Flying a long distance needs a lot of energy, which is released by respiration in the bird&#x27;s flight muscles, and the bird may not be able to feed for long periods during the journey, so it must carry its fuel with it. Fat stores contain more energy per gram than carbohydrate stores (roughly twice as much), so storing fuel as fat gives the bird the most energy for the least extra body mass. A lighter fuel store means the bird uses less energy carrying it, so it can fly further before it needs to stop and feed.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B3.04", "question": "Which element is found in all proteins, but not in carbohydrates and fats?", "answer": "Nitrogen (N). All proteins are made of amino acids, which contain carbon, hydrogen, oxygen and nitrogen, but carbohydrates and fats contain only carbon, hydrogen and oxygen. (Sulfur is found in some proteins, but not in all of them, so it is not the answer.)", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B3.P1", "question": "Identify which elements are contained in starch. (1 mark)\n\nA) carbon and hydrogen only\n\nB) carbon, hydrogen and oxygen\n\nC) carbon, hydrogen and nitrogen\n\nD) carbon, oxygen and nitrogen", "answer": "B \u2014 carbon, hydrogen and oxygen. [1] Starch is a carbohydrate made of many glucose molecules (C\u2086H\u2081\u2082O\u2086), and carbohydrates contain only C, H and O. A is wrong because it leaves out oxygen; C and D are wrong because starch contains no nitrogen (nitrogen is found in proteins).", "marks": 1, "hasImage": false, "imagePath": null}, {"id": "Question B3.P2", "question": "The table shows the results of tests on four samples of food. Identify which food contains only fat. (1 mark)\n\n| Food | Iodine test | Benedict&#x27;s test | Ethanol emulsion test | Biuret test |\n|------|-------------|-----------------|-----------------------|-------------|\n| A | brown | blue | milky white | blue |\n| B | blue-black | red | colourless | purple |\n| C | brown | blue | colourless | blue |\n| D | blue-black | red | milky white | purple |\n\nA) Food A\n\nB) Food B\n\nC) Food C\n\nD) Food D", "answer": "A \u2014 food A. [1] Food A gives a positive ethanol emulsion test (milky white), so it contains fat, and every other test is negative: iodine stays brown (no starch), Benedict&#x27;s stays blue (no reducing sugar) and biuret stays blue (no protein). Food B contains starch, reducing sugar and protein but no fat; food C contains none of these substances; food D contains starch, reducing sugar, fat and protein.", "marks": 1, "hasImage": false, "imagePath": null}, {"id": "Question B3.P3", "question": "Glucose, starch and glycogen are carbohydrates. (7 marks)\n\na) Identify which substance(s) are found in plants only, and not in animals? [1]\n\nb) Give the elements that the molecules of all these substances contain. [1]\n\nc) Describe the structure of a starch molecule. [2]\n\nd) Glucose is a reducing sugar. Describe how you could test a liquid to find out if it contains glucose. [3]", "answer": "a) Starch (only). [1] Glucose is found in both plants and animals, and glycogen is found only in animals.\n\nb) Carbon, hydrogen and oxygen (C, H and O). [1]\n\nc) A starch molecule is made of many glucose molecules [1] linked together in a long chain, which coils into a spiral shape [1].\n\nd) Add Benedict&#x27;s solution to a sample of the liquid in a test-tube [1]. Heat the tube in a water-bath (at about 80 \u00b0C) for a few minutes [1]. If glucose is present, the colour changes from blue to green, yellow or orange-red (brick red); if the mixture stays blue, there is no glucose [1].", "marks": 7, "hasImage": false, "imagePath": null}, {"id": "Question B3.P4", "question": "This question is about the biuret test and the ethanol emulsion test. (6 marks)\n\na) Biuret reagent is used to test for proteins. These statements about the biuret test are incorrect. Identify the errors so that you can write corrected versions of each statement.\n\ni) To carry out the biuret test, add biuret solution to the food and heat gently. [1]\n\nii) If a food contains protein, biuret reagent turns from purple to blue. [1]\n\nb) Ethanol is used to test for fats and oils.\n\ni) Describe how you would carry out the ethanol test. [3]\n\nii) Describe what you would see if the test gave a positive result. [1]", "answer": "a) i) The error is heating: the biuret test does not need heating. Corrected statement: to carry out the biuret test, add biuret solution to the food and shake to mix, without heating. [1]\n\na) ii) The colours are the wrong way round. Corrected statement: if a food contains protein, biuret reagent turns from blue to purple (violet). [1]\n\nb) i) Cut the food into very small pieces and put them into a clean test-tube with a little ethanol [1]. Shake the tube so that any fats or oils dissolve in the ethanol [1]. Pour the ethanol, without any of the food, into another clean test-tube containing distilled water [1].\n\nb) ii) A milky white (cloudy white) emulsion forms in the water. [1]", "marks": 6, "hasImage": false, "imagePath": null}, {"id": "Question B4.01", "question": "Explain why enzymes are called biological catalysts.", "answer": "Enzymes are catalysts because they increase the rate of chemical reactions without being changed by the reactions, so each enzyme molecule can be used again and again. They are called biological catalysts because they are proteins made by living cells, and they catalyse the metabolic reactions that take place inside living organisms. Without enzymes, these reactions would happen very slowly or not at all, far too slowly to sustain life.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B4.02", "question": "You read about the enzyme lactase at the start of this chapter.\n\na) What type of enzyme is lactase?\n\nb) Name the substrate of lactase.", "answer": "a) Lactase is a carbohydrase, because it breaks down a carbohydrate (the sugar lactose) into smaller sugar molecules.\n\nb) Lactose, the sugar found in milk.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B4.03", "question": "Look at Figure B4.03a. Describe what is shown on the graph. (When you are describing a graph, it is a good idea to quote figures, with units.)\n\n(Figure B4.03a is a graph of rate of reaction, with no scale, against temperature / \u00b0C from 0 to 60 \u00b0C. A single curve rises to a peak, which is labelled &#x27;optimum&#x27;, and then falls.)", "answer": "The graph shows how the rate of an enzyme-controlled reaction changes with temperature:\n- At 0 \u00b0C the rate of reaction is zero.\n- As the temperature increases from 0 \u00b0C, the rate increases, slowly at first (up to about 10 \u00b0C) and then steeply between about 20 \u00b0C and 35 \u00b0C.\n- The rate reaches a maximum at about 37\u201338 \u00b0C (just below 40 \u00b0C). This is the optimum temperature.\n- Above the optimum, the rate decreases, gradually at first and then very steeply, until it reaches zero at about 58\u201360 \u00b0C.\n- The rate falls much more steeply above the optimum than it rises below it.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B4.04", "question": "Look at Figure B4.03b.\n\na) What is the optimum pH of the protease in the stomach?\n\nb) What is the optimum pH of most enzymes?\n\nc) What is the range of pH values at which enzymes are able to work?\n\n(Figure B4.03b is a graph of rate of reaction against pH, from pH 0 to pH 10. It has two curves: one for a protease in the stomach, and one labelled &#x27;most enzymes&#x27;.)", "answer": "a) About pH 2. The peak of the protease curve is just below pH 2.\n\nb) About pH 7.\n\nc) For most enzymes, the range is from about pH 5.6 to about pH 10; below about pH 5.6 and above about pH 10 their activity is zero. The protease in the stomach has a different range, from about pH 0 to about pH 7. So, looking at both curves, enzymes can work across almost the whole range shown (about pH 0 to pH 10), but each enzyme works only over its own narrower range.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B4.05", "question": "Look at the graph that you drew from your results in Experimental skills B4.02 Investigating the effect of temperature on the activity of lipase. In your own words, explain the shape of the graph (use your biological knowledge and understanding to give reasons for the shape of the graph).", "answer": "The graph of time taken for the blue colour to disappear (y-axis) against temperature (x-axis) should be roughly U-shaped. The time is long at low temperatures, falls to a minimum at the optimum temperature (often around 40 \u00b0C), and then rises again at higher temperatures. At the highest temperature the colour may not have disappeared at all. A short time means a fast rate, so this graph is the upside-down version of a rate graph like Figure B4.03a.\n- Low temperatures (long times): lipase and lipid molecules have little kinetic energy and move slowly, so they rarely collide. Few lipid molecules enter the active site each second, so fatty acids are made slowly and it takes a long time for the pH to fall enough to make the thymolphthalein colourless.\n- Rising towards the optimum (times get s", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B4.06", "question": "Use your own words to explain the shapes of the curves for most enzymes, in Figure B4.03b.\n\n(In Figure B4.03b, the curve for most enzymes is at zero below about pH 5.6, rises steeply to a peak at about pH 7, and then falls back to zero at about pH 10.)", "answer": "- At the optimum pH (about pH 7): the enzyme molecule has exactly the right shape, so its active site is the best fit for (complementary to) the substrate. Substrate molecules fit easily, many enzyme\u2013substrate complexes form, and the rate of reaction is highest.\n- As the pH moves away from 7 (more acidic or more alkaline): the change in pH begins to change the shape of the enzyme molecule, including its active site. The active site becomes less complementary to the substrate, so fewer substrate molecules can fit and bind, fewer enzyme\u2013substrate complexes form, and the rate falls.\n- Well below or well above the optimum (below about pH 5.6 or above about pH 10): the enzyme has lost its shape completely; it is denatured. The substrate can no longer bind with the active site, so the rate is ze", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B4.P1", "question": "Identify the smaller molecules from which an enzyme molecule is made. (1 mark)\n\nA) amino acids\nB) fatty acids\nC) glucose\nD) glycerol", "answer": "A \u2014 amino acids. Enzymes are proteins, and protein molecules are made from long chains of amino acids [1]. Fatty acids and glycerol are the smaller molecules that make up lipids, and glucose is the smaller molecule that makes up starch.", "marks": 1, "hasImage": false, "imagePath": null}, {"id": "Question B4.P2", "question": "(5 marks)\n\na) Complete the sentences about enzymes. Choose words from the list. [3]\n\nWord list: chemical, proteins, metabolic, active, complementary\n\nEnzymes are ______ that function as biological catalysts.\n\nEnzymes are involved in all ______ reactions.\n\nThe part of an enzyme where a substrate binds is called its ______ site.\n\nb) Describe why enzymes are important to all living organisms. [2]", "answer": "a) Enzymes are proteins that function as biological catalysts [1]. Enzymes are involved in all metabolic reactions [1]. The part of an enzyme where a substrate binds is called its active site [1]. (&quot;Chemical&quot; is not accepted for the second gap, because enzymes are not involved in all chemical reactions, only in metabolic reactions inside living things.)\n\nb) Any two of these points:\n- Enzymes speed up (catalyse) the metabolic reactions in living organisms [1].\n- Without enzymes, these reactions would happen too slowly or not at all; enzymes make the reactions fast enough to sustain life [1].\n- They allow essential processes to happen quickly enough, for example digesting food so that it can be absorbed, building proteins from amino acids, or breaking down toxic hydrogen peroxide (catalase) ", "marks": 5, "hasImage": false, "imagePath": null}, {"id": "Question B4.P3", "question": "The figure below shows some stages in an enzyme-controlled reaction. (4 marks)\n\n(The figure shows three stages, from top to bottom. Stage 1: an enzyme molecule (labelled &#x27;enzyme&#x27;) with a dent in one side, labelled Q, and a separate round molecule labelled P. Stage 2: the round molecule fitted into the dent of the enzyme, with the two together labelled R. Stage 3: the enzyme, with its dent empty again, next to the round molecule now split into two pieces, labelled S.)\n\nIdentify the parts labelled P, Q, R and S. [4]\n\nP: ______\n\nQ: ______\n\nR: ______\n\nS: ______", "answer": "P = substrate [1]\n\nQ = active site [1]\n\nR = enzyme\u2013substrate complex [1]\n\nS = products (the product molecules) [1]", "marks": 4, "hasImage": false, "imagePath": null}, {"id": "Question B4.P4", "question": "Amylase is an enzyme that breaks down starch to maltose. (9 marks)\n\na) A student put some starch solution into a test-tube. He took a small sample of starch from the tube and added it to a drop of iodine solution on a white tile.\n\n(The figure shows a test-tube of starch solution, a glass rod carrying a sample of starch solution, and a white tile with drops of iodine solution in its dimples.)\n\nNext, he added some amylase solution to the starch solution. After five minutes, he took another sample from the tube, and tested it with iodine solution.\n\nThe table shows his results.\n\n| | Result of iodine test |\n|---|---|\n| At start | blue-black |\n| After adding amylase solution | brown |\n\nExplain the student&#x27;s results. [3]\n\nb) The student investigated the effect of pH on the activity of amylase.\n\nH", "answer": "a) Any three of these points:\n- At the start, the sample turned the iodine solution blue-black, which shows that starch was present [1].\n- Amylase broke down (digested) the starch [1] into maltose [1].\n- After five minutes the iodine solution stayed brown, which shows that there was no starch left; maltose does not give a blue-black colour with iodine [1].\n\nb) i) One mark for each of these points:\n- Amylase is most active at pH 7, which is its optimum pH; the starch disappeared in the shortest time (4 min) [1].\n- Activity decreases as the pH moves away from 7 in either direction: the starch took 8 min to disappear at pH 6 and 14 min at pH 9 [1].\n- At pH 4 and pH 11 the starch did not disappear, so the amylase was not working (it was denatured) at these pH values [1].\n- Working with rates: ", "marks": 9, "hasImage": false, "imagePath": null}, {"id": "Question B4.P5", "question": "The graph below shows how the activity of two enzymes, A and B, is affected by temperature. (12 marks)\n\n(The graph plots rate of activity, with no scale, on the y-axis against temperature / \u00b0C on the x-axis, from 0 to 100 \u00b0C. Enzyme A: activity rises from zero at 10 \u00b0C to a peak at 40 \u00b0C, then falls steeply to zero at about 58 \u00b0C. Enzyme B: activity rises from zero at 40 \u00b0C to a peak at 70 \u00b0C, then falls to zero at about 92 \u00b0C. The two peaks are at about the same height, and the two curves cross at about 55 \u00b0C.)\n\na) Compare the effect of temperature on enzyme A and enzyme B. [5]\n\nb) Explain the effect of temperature on enzyme B from:\n\ni) 40 to 60 \u00b0C [3]\n\nii) 70 to 90 \u00b0C. [4]", "answer": "a) Any five of these points (a comparison needs similarities and differences, and each statement should mention both enzymes):\n- Similar pattern: for both enzymes, activity increases as temperature increases up to an optimum, and then decreases [1].\n- Enzyme A has an optimum temperature of 40 \u00b0C, whereas enzyme B has an optimum of 70 \u00b0C, which is 30 \u00b0C higher [1].\n- Enzyme A starts to work at 10 \u00b0C, but enzyme B shows no activity until 40 \u00b0C [1].\n- Enzyme A stops working (is completely denatured) at about 58 \u00b0C, whereas enzyme B keeps working until about 92 \u00b0C [1].\n- Both enzymes reach about the same maximum rate of activity [1].\n- Both work over a similar range of about 50 \u00b0C: A from 10 \u00b0C to about 58 \u00b0C, and B from 40 \u00b0C to about 92 \u00b0C [1].\n- Below about 55 \u00b0C enzyme A is more active tha", "marks": 12, "hasImage": false, "imagePath": null}, {"id": "Question B5.01", "question": "Explain why animals are dependent on plants for their supply of energy.", "answer": "Animals cannot make organic substances (carbohydrates, fats and proteins) from inorganic substances, so they must take them in as food. Plants can make organic substances by photosynthesis: chlorophyll captures light energy from the Sun and transfers it into chemical energy stored in glucose and in the other substances made from it. Animals get this energy by eating plants, or by eating other animals that have eaten plants. So all the energy in an animal&#x27;s food originally came from sunlight captured by plants \u2014 without plants, animals would have no supply of energy.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B5.02", "question": "Explain how chlorophyll helps photosynthesis to happen.", "answer": "Chlorophyll is a green pigment found in chloroplasts. It captures (absorbs) energy from sunlight and immediately transfers this energy to water molecules and carbon dioxide molecules. This energy makes the carbon dioxide and water react together to produce glucose (and oxygen). In this way, chlorophyll transfers energy from light into chemical energy in carbohydrates. Without chlorophyll, light shining on carbon dioxide and water would never produce glucose.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B5.03", "question": "How many glucose molecules can be made from 12 molecules of carbon dioxide and 12 molecules of water?", "answer": "2 glucose molecules.\n\nWorking: the balanced equation is 6CO\u2082 + 6H\u2082O \u2192 C\u2086H\u2081\u2082O\u2086 + 6O\u2082, so 6 molecules of carbon dioxide and 6 molecules of water make 1 molecule of glucose. 12 \u00f7 6 = 2, so 12 molecules of carbon dioxide and 12 molecules of water make 2 molecules of glucose (and 12 molecules of oxygen). Check using carbon atoms: 12 CO\u2082 molecules contain 12 carbon atoms, and each glucose molecule needs 6, so 12 \u00f7 6 = 2.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B5.04", "question": "Starch can easily be broken down to glucose by the enzyme amylase, which is found in plants. Cellulose is much more difficult to break down to glucose. Suggest how these differences between starch and cellulose relate to their functions in a plant.", "answer": "Starch is the plant&#x27;s energy store. When the plant needs energy (for example at night, or when a seed germinates), it must be able to turn the stored starch back into glucose quickly for respiration, so it is useful that amylase can break starch down easily. Cellulose forms the cell walls, which give each cell strength and support and must last for the whole life of the cell. If cellulose were easy to break down (for example by the plant&#x27;s own amylase), the cell walls would be weakened or destroyed. Because cellulose is difficult to break down, the walls stay strong and permanent.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B5.05", "question": "Animals do not make or store starch. What is the substance that animals store, which is made of chains of glucose molecules?", "answer": "Glycogen (stored mainly in the liver and muscles).", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B5.06", "question": "Explain why some parts of a plant must have sucrose delivered to them.", "answer": "Glucose can only be made by photosynthesis in the parts of a plant that contain chlorophyll, which usually means the leaves. Other parts, such as the roots, flowers, fruits, seeds, storage organs and the inner parts of the stem, have no chlorophyll (or get no light), so they cannot make their own glucose. Their cells still need carbohydrate: for respiration to release energy, to make cellulose for new cell walls as they grow, and to make starch for storage. Plants do not transport glucose \u2014 they change it into sucrose, which is carried in the phloem to these parts and changed back into glucose when it arrives.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B5.07", "question": "Copy and complete this table.\n\n| Element | \u2026\u2026 | magnesium |\n|---|---|---|\n| Mineral salt | nitrate ions | magnesium ions |\n| Why needed | to make \u2026\u2026, and then proteins | \u2026\u2026 |\n| Deficiency | weak growth, yellow leaves | yellowing of leaves, often especially between the veins |", "answer": "| Element | nitrogen | magnesium |\n|---|---|---|\n| Mineral salt | nitrate ions | magnesium ions |\n| Why needed | to make amino acids, and then proteins | to make chlorophyll |\n| Deficiency | weak growth, yellow leaves | yellowing of leaves, often especially between the veins |\n\nThe three missing entries are nitrogen, amino acids and to make chlorophyll.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B5.08", "question": "Making nectar costs a plant energy because it uses up glucose that the plant has made. Explain why the expense is worthwhile.", "answer": "Nectar attracts pollinators \u2014 insects, bats or birds \u2014 to the flowers. The male gametes of a flower are inside pollen grains and cannot move themselves, so the plant relies on these animals to carry pollen from one flower to another. Animals will only do this if they get a reward, and nectar is that reward. Pollination allows fertilisation to happen, so the plant can reproduce sexually and produce seeds that grow into new plants. Without nectar, far fewer flowers would be pollinated, so the glucose used is a worthwhile price for successful reproduction.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B5.09", "question": "Figure B5.10 shows a photomicrograph (\u00d7400) of a small part of a leaf from a tea plant. Identify structures A\u2013D.\n\nDescription of Figure B5.10: label A points to the row of cells forming the top surface of the leaf; label B points to the layer of tall, narrow cells packed side by side just below it; label C points to the region of rounded, loosely arranged cells with spaces between them in the lower part of the leaf; label D points up to a gap in the bottom row of cells, with a large space just above it.", "answer": "A \u2014 upper epidermis (covered on the outside by the thin cuticle)\n\nB \u2014 palisade mesophyll\n\nC \u2014 spongy mesophyll\n\nD \u2014 a stoma (the opening between two guard cells in the lower epidermis)", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B5.10", "question": "Explain how a palisade mesophyll cell is adapted for its function.", "answer": "The function of a palisade mesophyll cell is photosynthesis. It is adapted in these ways:\n- It contains very large numbers of chloroplasts, which contain chlorophyll, so it can absorb as much light energy as possible.\n- It is tall and narrow, and the cells are packed tightly side by side, so a large number of cells (and chloroplasts) fit into the top part of the leaf, where the light is brightest.\n- It is close to the top of the leaf, just below the transparent cuticle and upper epidermis, so it receives plenty of sunlight.\n- It is close to the air spaces of the spongy mesophyll, which supply carbon dioxide by diffusion, and to the veins, which supply water.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B5.11", "question": "Suggest why the cells in the lower epidermis of a leaf (apart from the guard cells) do not contain chloroplasts.", "answer": "Very little light reaches the lower epidermis. Sunlight falls mainly on the upper surface of the leaf, and most of it is absorbed by the chloroplasts in the palisade and spongy mesophyll before it reaches the bottom layer. Chloroplasts in the lower epidermis would therefore carry out very little photosynthesis, so making them would waste the plant&#x27;s materials and energy. The job of the lower epidermis is to cover and protect the leaf and to contain the stomata for gas exchange, not to photosynthesise.", "marks": 2, "hasImage": false, "imagePath": null}, {"id": "Question B5.P1", "question": "Identify the raw materials required for photosynthesis. (1 mark)\n\nA) carbon dioxide and oxygen\nB) oxygen and glucose\nC) glucose and water\nD) water and carbon dioxide", "answer": "D \u2014 water and carbon dioxide. These are the reactants of photosynthesis. Oxygen and glucose are the products, so options A, B and C are wrong.", "marks": 1, "hasImage": false, "imagePath": null}, {"id": "Question B5.P2", "question": "Identify which ion a plant requires to make amino acids from glucose. (1 mark)\n\nA) calcium\nB) iron\nC) magnesium\nD) nitrate", "answer": "D \u2014 nitrate. Amino acids contain nitrogen, which glucose does not. Plants absorb nitrogen from the soil as nitrate ions and combine it with glucose to make amino acids. Magnesium ions are needed to make chlorophyll, not amino acids.", "marks": 1, "hasImage": false, "imagePath": null}, {"id": "Question B5.P3", "question": "The diagram shows a three-dimensional drawing of a section through a leaf. (9 marks)\n\nDescription of the diagram: a block cut from a leaf, with its layers labelled from top to bottom. A labels the thin layer covering the top surface; B labels the top layer of cells; C labels a layer of tall, narrow cells packed side by side; D labels a deep layer of rounded cells with spaces between them; E labels a bundle of tubes running through the leaf; F labels a space between the rounded cells; G labels a pore in the bottom surface; H labels one of the two cells surrounding that pore; I labels the bottom layer of cells.\n\na) i) Identify the tissue labelled C. [1]\n\na) ii) Outline how this tissue is adapted for its function. [2]\n\nb) Give the letters of two cells or tissues that do not contain chloroplas", "answer": "a) i) Palisade mesophyll. [1]\n\na) ii) Any two of the following [2]:\n- The cells contain very large numbers of chloroplasts (containing chlorophyll) to absorb as much light energy as possible.\n- The cells are tall, narrow and tightly packed side by side, so many cells fit into the top part of the leaf.\n- The layer is close to the upper surface, just below the transparent epidermis, so it receives plenty of sunlight.\n- The cells are close to air spaces (supplying carbon dioxide) and veins (supplying water).\n\nb) Any two of: B (upper epidermis), I (lower epidermis, apart from its guard cells) and E (vascular bundle \u2014 xylem and phloem). [2] Do not choose A, F or G: they are not cells (the cuticle, an air space and a stoma).\n\nc) H is a guard cell. It changes shape to open and close the stoma, G ", "marks": 9, "hasImage": false, "imagePath": null}, {"id": "Question B5.P4", "question": "The bar chart shows the mean number of chloroplasts in four different types of cell in a leaf. (7 marks)\n\nData read from the bar chart (y-axis: mean number of chloroplasts per cell, scale 0 to 100; x-axis: type of cell):\n\n| Type of cell | Mean number of chloroplasts per cell |\n|---|---|\n| A | 0 (no bar) |\n| B | about 15 |\n| C | about 71 |\n| Palisade mesophyll | about 100 (the bar reaches the top of the scale) |\n\na) Explain why palisade mesophyll cells have so many chloroplasts. [2]\n\nb) State which cell could be a cell in the upper epidermis. Explain your answer. [2]\n\nc) Guard cells contain chloroplasts, but not as many as spongy mesophyll cells. Suggest which cell could be a guard cell. [1]\n\nd) Chloroplasts contain chlorophyll. Describe the function of chlorophyll in photosynthesis. [2]", "answer": "a) Palisade mesophyll cells are the main site of photosynthesis in the leaf [1]. They are near the upper surface, where they receive the most light, so having many chloroplasts (and so lots of chlorophyll) lets them absorb as much light energy as possible and photosynthesise quickly, making more glucose [1].\n\nb) Cell A [1]. Upper epidermis cells contain no chloroplasts (A has a mean of 0); they are transparent so that light passes through them to the palisade cells below [1].\n\nc) Cell B \u2014 it has some chloroplasts (about 15), but far fewer than cell C (about 71), which must be a spongy mesophyll cell [1].\n\nd) Chlorophyll absorbs (captures) energy from sunlight [1] and transfers it into chemical energy in carbohydrates \u2014 the energy makes carbon dioxide and water react to form glucose [1].", "marks": 7, "hasImage": false, "imagePath": null}, {"id": "Question B5.P5", "question": "(8 marks)\n\na) Describe how plants synthesise carbohydrates. [4]\n\nb) Outline two subsequent uses of the carbohydrates made in photosynthesis. [4]", "answer": "a) Any four of the following [4]:\n- Plants make carbohydrates by photosynthesis, mainly in the palisade mesophyll cells of their leaves.\n- Carbon dioxide diffuses into the leaf from the air through the stomata; water is absorbed from the soil by the roots and carried to the leaf in the xylem.\n- In the chloroplasts, chlorophyll absorbs energy from sunlight.\n- Chlorophyll transfers this energy to carbon dioxide and water, making them react; the reactions are catalysed by enzymes.\n- The products are glucose (a carbohydrate) and oxygen, which is released.\n- Equation: 6CO\u2082 + 6H\u2082O \u2192 C\u2086H\u2081\u2082O\u2086 + 6O\u2082\n\nb) Any two uses, each with an explanation [2 + 2]:\n- Respiration [1] \u2014 glucose is broken down to release energy, for example for active transport of mineral ions into root hairs, or for building protei", "marks": 8, "hasImage": false, "imagePath": null}, {"id": "Question B5.P6", "question": "Two students carried out an experiment to investigate the effect of carbon dioxide concentration on the rate of photosynthesis of an aquatic plant. The photograph shows some of the apparatus that they used. (15 marks)\n\nDescription of the photograph: several syringes are clamped upright, side by side, outdoors in bright sunshine, with a long thin transparent tube running down from the nozzle of each syringe.\n\n- The students filled five syringes with five different concentrations of sodium hydrogencarbonate solution. This provides carbon dioxide.\n- They placed a piece of aquatic plant in each syringe.\n- They attached a long transparent tube to the nozzle of each syringe.\n- They pushed the plunger of each syringe in a little way, to force some of the sodium hydrogencarbonate into the tubing.\n", "answer": "a) Independent variable: the concentration of the sodium hydrogencarbonate solution, which determines how much carbon dioxide is available [1]. Dependent variable: the distance moved by the meniscus in 30 minutes, which shows how much oxygen was produced, and so the rate of photosynthesis [1].\n\nb) Light is needed for photosynthesis, because it provides the energy [1]. Bright sunshine gives a high light intensity, so light is not a limiting factor: the rate is limited by the carbon dioxide concentration, and all five syringes receive the same high light intensity, making it a fair test [1].\n\nc) The correct graph shows [5]:\n- The concentration on the x-axis, labelled &quot;Concentration of sodium hydrogencarbonate solution / %&quot;, and the distance on the y-axis, labelled &quot;Distance moved by meniscus", "marks": 15, "hasImage": false, "imagePath": null}], "totalMarks": 226};
let timerInterval = null;
let secondsLeft = 0;
let startTime = null;

document.getElementById('totalQ').textContent = EXAM.questions.length;
document.getElementById('totalM').textContent = EXAM.totalMarks;
document.getElementById('timeLimit').textContent = EXAM.timeMinutes;

function startExam() {
  document.getElementById('btnStart').classList.add('hidden');
  document.getElementById('questionsArea').classList.remove('hidden');
  document.getElementById('submitArea').classList.remove('hidden');
  secondsLeft = EXAM.timeMinutes * 60;
  startTime = Date.now();
  renderQuestions();
  timerInterval = setInterval(tick, 1000);
  tick();
}

function tick() {
  secondsLeft--;
  const m = Math.floor(secondsLeft / 60);
  const s = secondsLeft % 60;
  const el = document.getElementById('timer');
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.className = 'timer' + (secondsLeft < 300 ? (secondsLeft < 60 ? ' danger' : ' warning') : '');
  if (secondsLeft <= 0) { clearInterval(timerInterval); submitExam(); }
}

function renderQuestions() {
  const area = document.getElementById('questionsArea');
  area.innerHTML = '';
  EXAM.questions.forEach((q, i) => {
    const div = document.createElement('div');
    div.className = 'q-card';
    div.innerHTML = `
      <div class="q-header">
        <span class="q-num">Question ${i+1} — ${q.id}</span>
        <span class="q-marks">[${q.marks} marks]</span>
      </div>
      <div class="q-text">${q.question}</div>
      <textarea id="ans_${i}" placeholder="Write your answer here..."></textarea>
      <div class="answer-reveal" id="reveal_${i}"><b>Model Answer:</b><br>${q.answer}</div>
    `;
    area.appendChild(div);
  });
}

function submitExam() {
  clearInterval(timerInterval);
  const elapsed = Math.round((Date.now() - startTime) / 1000);
  const m = Math.floor(elapsed / 60);
  const s = elapsed % 60;

  document.getElementById('submitArea').classList.add('hidden');
  document.querySelectorAll('.answer-reveal').forEach(el => el.classList.add('show'));
  document.querySelectorAll('textarea').forEach(el => el.disabled = true);
  document.getElementById('timer').textContent = 'DONE';
  document.getElementById('timer').className = 'timer';

  const results = document.getElementById('resultsArea');
  results.classList.remove('hidden');
  results.innerHTML = `
    <div class="results">
      <h2>Exam Complete</h2>
      <div class="time-taken">Time taken: ${m}m ${s}s</div>
      <p style="margin-top:12px;color:#555;">Model answers shown below each question. Review your responses.</p>
    </div>
  `;

  try {
    const sessions = JSON.parse(localStorage.getItem('sf_exam_sessions') || '[]');
    sessions.push({ date: new Date().toISOString(), questions: EXAM.questions.length, totalMarks: EXAM.totalMarks, timeSec: elapsed });
    localStorage.setItem('sf_exam_sessions', JSON.stringify(sessions));
  } catch(e) {}
}
</script>
</body>
</html>
